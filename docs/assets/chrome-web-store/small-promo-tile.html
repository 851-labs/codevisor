<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(110% 100% at 50% 0%, #26262a 0%, #000000 70%);
        color: #f5f5f7;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
      }

      h1 {
        margin-top: 6px;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      p {
        margin-top: 6px;
        color: #a1a1a6;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <img src="source/codevisor-icon.png" alt="" />
    <h1>Codevisor</h1>
    <p>Let your coding agents use Chrome</p>
  </body>
</html>
