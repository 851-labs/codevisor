only_rules:
  - file_length
  - type_body_length
  - file_name
  - function_body_length
  - custom_rules

included:
  - apps/ios
  - apps/macos
  - apps/pixelbook
  - apps/shared
  - packages

excluded:
  - apps/macos/Codevisor/Vendor
  - packages/ghostty-terminal/Sources/Vendor
  - "**/Generated"
  - "**/.build"
  - "**/DerivedData"
  - tmp
  - .repos
  - node_modules
  - "**/node_modules"

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 50
  error: 100

file_name:
  severity: warning
  excluded_paths:
    - /apps/pixelbook/

custom_rules:
  no_comments:
    name: No comments
    message: Comments are not allowed. Say it in the code, or delete it.
    regex: '(?://|/\*)(?!\s*(?:swift-tools-version:|swiftlint:(?:disable|enable)))'
    match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field]
    severity: error
  pane_keyboard_shortcut:
    name: Pane keyboard shortcut
    message: >-
      A view's keyboard shortcut reaches the whole window, not just its pane; put it in a
      focus-scoped menu command instead.
    regex: '(^|[\s)}\]])\.keyboardShortcut\('
    excluded_match_kinds: [comment, doccomment, string]
    severity: error
    included:
      - packages/swift/SimulatorPane/Sources/
      - packages/swift/ScreenSharing/Sources/
      - apps/macos/Codevisor/Chromium/
      - apps/macos/Codevisor/Features/Panes/
      - apps/macos/Codevisor/Features/Session/
      - apps/macos/Codevisor/Features/Terminal/
    excluded:
      - Command(s|Items)\.swift$
      - Sheet\.swift$
  webrtc_factory_installs_field_trials:
    name: WebRTC factory installs field trials
    message: >-
      Build RTCPeerConnectionFactory through ScreenSharingFieldTrials.makeFactory, so the product
      field trials are installed before the first peer.
    regex: 'RTCPeerConnectionFactory(\.init)?\s*\('
    excluded_match_kinds: [comment, doccomment, string]
    severity: error
    excluded:
      - ScreenSharing/Sources/ScreenSharingWebRTC/FieldTrials/ScreenSharingFieldTrials\.swift$
