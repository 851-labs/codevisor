name: Build CodevisorBench
description: >-
  Builds CodevisorBench.app at the checked-out commit, signs it with the repository's Developer ID identity (team
  C4M7D4G7LG; permission grants on the minis must be for that team's app) into $RUNNER_TEMP/bench.noindex; it builds in _work/codevisor-bench-build.noindex (Spotlight skips both), and points CODEVISOR_BENCH_APP at it. It doesn't touch the installed app; jobs that need its permission grants then run scripts/install-granted.sh.
inputs:
  certificate:
    description: The Developer ID Application certificate, base64-encoded PKCS#12
    required: true
  certificate-password:
    description: The certificate's password
    required: true
  identity:
    description: The signing identity
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "DEVELOPER_DIR=$(scripts/release/resolve-xcode.sh)" >> "$GITHUB_ENV"
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/setup-rust
    - shell: bash
      env:
        APPLE_CERTIFICATE_BASE64: ${{ inputs.certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: apps/screen-sharing-bench/scripts/signing-keychain.sh import
    - shell: bash
      env:
        CODEVISOR_BENCH_SIGNING_IDENTITY: ${{ inputs.identity }}
        CODEVISOR_BENCH_SCRATCH: ${{ runner.temp }}/../codevisor-bench-build.noindex
      run: |
        app="$(apps/screen-sharing-bench/scripts/build-pinned.sh "$RUNNER_TEMP/bench.noindex")"
        echo "CODEVISOR_BENCH_APP=$app" >> "$GITHUB_ENV"
    - shell: bash
      if: always()
      run: apps/screen-sharing-bench/scripts/signing-keychain.sh remove
