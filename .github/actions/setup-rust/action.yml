name: Set up Rust
description: >-
  Installs the Rust toolchain pinned in scripts/net-build.lock.json (the
  tunnel's native code, docs/plans/codevisor-tunnel.md) and puts cargo on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        toolchain="$(node -p 'require("./scripts/net-build.lock.json").rust')"
        if ! command -v rustup >/dev/null 2>&1 && [[ ! -x "$HOME/.cargo/bin/rustup" ]]; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install "$toolchain" --profile minimal
        rustup default "$toolchain"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    # Linux addons link against an old glibc with cargo-zigbuild (scripts/net-artifact.mjs).
    - shell: bash
      if: runner.os == 'Linux'
      run: |
        zig="$(node -p 'require("./scripts/net-build.lock.json").zig')"
        zigbuild="$(node -p 'require("./scripts/net-build.lock.json").cargoZigbuild')"
        python3 -m pip install --user --break-system-packages --quiet \
          "ziglang==$zig" "cargo-zigbuild==$zigbuild"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        rustup target add "$(uname -m | sed 's/arm64/aarch64/')-unknown-linux-gnu"
