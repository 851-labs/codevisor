name: Bench screen sharing tier 2

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: Comma-separated scenes, each optionally on its own network (scroll@N3); the plan must fit 30 minutes
        required: false
        default: scroll
        type: string
      repetitions:
        description: Repetitions per scene of each system, 1 to 4
        required: false
        default: "3"
        type: string
      duration:
        description: Seconds per run, 15 to 120
        required: false
        default: "60"
        type: string
      floor-repetitions:
        description: Null-sharing floor runs per scene, 0 to 3
        required: false
        default: "1"
        type: string
      c4:
        description: Also run S5 with the host observer off (C4) when video is among the scenes
        required: false
        default: true
        type: boolean
      network:
        description: N0 (no shaping), N3 (1 ms and 1% loss each way) or N6 (25 ms, 0.1% loss and 50 Mbit/s each way), dummynet on croissant
        required: false
        default: N0
        type: string
      present:
        description: Codevisor presentation on the viewer, arrival or display-link
        required: false
        default: arrival
        type: string
      systems:
        description: Comma-separated systems to run besides the floor (apple-hp, codevisor-v2, codevisor-v2-vcp)
        required: false
        default: apple-hp,codevisor-v2-vcp
        type: string
      viewer-display:
        description: Where croissant shows every system, main (its 1920x1080 display) or R1x2 (a 3840x2160 virtual display, so Apple HP is 1:1)
        required: false
        default: main
        type: string
      profile:
        description: Also sample call trees of the host's sharing processes for 10 s in each run (perturbs that run's numbers)
        required: false
        default: false
        type: boolean
      vcp-fail-after:
        description: Seconds into each codevisor-v2-vcp run to force a VCP failure (0 never), to test the VideoToolbox fallback
        required: false
        default: "0"
        type: string
      input-events:
        description: Space presses and clicks of each kind per input-scene run, 1 to 400 (they must fit the run's duration)
        required: false
        default: "200"
        type: string
  workflow_call:
    inputs:
      scenes:
        description: Comma-separated scenes, each optionally on its own network (scroll@N3); the plan must fit 30 minutes
        required: false
        default: scroll
        type: string
      repetitions:
        description: Repetitions per scene of each system, 1 to 4
        required: false
        default: "3"
        type: string
      duration:
        description: Seconds per run, 15 to 120
        required: false
        default: "60"
        type: string
      floor-repetitions:
        description: Null-sharing floor runs per scene, 0 to 3
        required: false
        default: "1"
        type: string
      c4:
        description: Also run S5 with the host observer off (C4) when video is among the scenes
        required: false
        default: true
        type: boolean
      network:
        description: N0 (no shaping), N3 (1 ms and 1% loss each way) or N6 (25 ms, 0.1% loss and 50 Mbit/s each way), dummynet on croissant
        required: false
        default: N0
        type: string
      present:
        description: Codevisor presentation on the viewer, arrival or display-link
        required: false
        default: arrival
        type: string
      systems:
        description: Comma-separated systems to run besides the floor (apple-hp, codevisor-v2, codevisor-v2-vcp)
        required: false
        default: apple-hp,codevisor-v2-vcp
        type: string
      viewer-display:
        description: Where croissant shows every system, main (its 1920x1080 display) or R1x2 (a 3840x2160 virtual display, so Apple HP is 1:1)
        required: false
        default: main
        type: string
      profile:
        description: Also sample call trees of the host's sharing processes for 10 s in each run (perturbs that run's numbers)
        required: false
        default: false
        type: boolean
      vcp-fail-after:
        description: Seconds into each codevisor-v2-vcp run to force a VCP failure (0 never), to test the VideoToolbox fallback
        required: false
        default: "0"
        type: string
      input-events:
        description: Space presses and clicks of each kind per input-scene run, 1 to 400 (they must fit the run's duration)
        required: false
        default: "200"
        type: string
      label:
        description: Names this dispatch's artifacts (tier2-<label>-*) when one workflow run calls Tier 2 more than once
        required: false
        default: ""
        type: string
      bench-artifact:
        description: Run the CodevisorBench.app an earlier job of this run built (a ditto zip in this artifact) instead of building it
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: screen-sharing-bench
  cancel-in-progress: false

env:
  TIER2_HOST_IP: 192.168.10.78
  TIER2_VIEWER_IP: 192.168.10.103
  TIER2_SCENES: ${{ inputs.scenes }}
  TIER2_REPS: ${{ inputs.repetitions }}
  TIER2_DURATION: ${{ inputs.duration }}
  TIER2_FLOOR_REPS: ${{ inputs.floor-repetitions }}
  TIER2_C4: ${{ inputs.c4 && '1' || '0' }}
  TIER2_NETWORK: ${{ inputs.network }}
  TIER2_PRESENT: ${{ inputs.present }}
  TIER2_SYSTEMS: ${{ inputs.systems }}
  TIER2_VIEWER_DISPLAY: ${{ inputs.viewer-display }}
  TIER2_PROFILE: ${{ inputs.profile && '1' || '0' }}
  TIER2_VCP_FAIL_AFTER: ${{ inputs.vcp-fail-after }}
  TIER2_INPUT_EVENTS: ${{ inputs.input-events || '200' }}
  TIER2_ARTIFACTS: tier2${{ inputs.label && format('-{0}', inputs.label) || '' }}
  TIER2_RENDEZVOUS_S: 1800

jobs:
  host:
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 90
    env: &first-attempt
      TIER2_ARTIFACT_SUFFIX: ""
      TIER2_PAIR_HOLD_S: 600
      TIER2_UNPAIRED: yield
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: &host-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Wait for the viewer job to start on croissant
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apps/screen-sharing-bench/scripts/tier2-pair.sh viewer "$TIER2_PAIR_HOLD_S" "$TIER2_UNPAIRED"
      - if: steps.pair.outputs.paired == 'true' && !inputs.bench-artifact
        uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - if: steps.pair.outputs.paired == 'true' && inputs.bench-artifact
        uses: ./.github/actions/fetch-screen-sharing-bench
        with:
          name: ${{ inputs.bench-artifact }}
      - name: Install the build where the permission grants are
        if: steps.pair.outputs.paired == 'true'
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Host the Tier 2 runs on tamale
        if: steps.pair.outputs.paired == 'true'
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier2-host.sh "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.pair.outputs.paired == 'true'
        with:
          name: ${{ env.TIER2_ARTIFACTS }}-tamale${{ env.TIER2_ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/results

  viewer:
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 90
    env: *first-attempt
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: &viewer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Wait for the host job to start on tamale
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apps/screen-sharing-bench/scripts/tier2-pair.sh host "$TIER2_PAIR_HOLD_S" "$TIER2_UNPAIRED"
      - if: steps.pair.outputs.paired == 'true' && !inputs.bench-artifact
        uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - if: steps.pair.outputs.paired == 'true' && inputs.bench-artifact
        uses: ./.github/actions/fetch-screen-sharing-bench
        with:
          name: ${{ inputs.bench-artifact }}
      - name: Install the build where the permission grants are
        if: steps.pair.outputs.paired == 'true'
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: View the Tier 2 runs on croissant
        if: steps.pair.outputs.paired == 'true'
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier2-viewer.sh "$RUNNER_TEMP/results"
      - name: Remove any network shaping
        if: always() && steps.pair.outputs.paired == 'true'
        run: apps/screen-sharing-bench/scripts/tier2-network-reset.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.pair.outputs.paired == 'true'
        with:
          name: ${{ env.TIER2_ARTIFACTS }}-croissant${{ env.TIER2_ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/results

  host-retry:
    needs: host
    if: ${{ !cancelled() && needs.host.outputs.paired == 'false' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 135
    env: &retry
      TIER2_ARTIFACT_SUFFIX: -retry
      TIER2_PAIR_HOLD_S: 3600
      TIER2_UNPAIRED: fail
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: *host-steps

  viewer-retry:
    needs: viewer
    if: ${{ !cancelled() && needs.viewer.outputs.paired == 'false' }}
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 135
    env: *retry
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: *viewer-steps

  report:
    needs: [host, viewer, host-retry, viewer-retry]
    if: >-
      ${{ !cancelled()
      && (needs.host.outputs.paired == 'true' || needs.host-retry.outputs.paired == 'true')
      && (needs.viewer.outputs.paired == 'true' || needs.viewer-retry.outputs.paired == 'true') }}
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - if: ${{ !inputs.bench-artifact }}
        uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - if: inputs.bench-artifact
        uses: ./.github/actions/fetch-screen-sharing-bench
        with:
          name: ${{ inputs.bench-artifact }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ env.TIER2_ARTIFACTS }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/runs
      - name: Build the report and the target table
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          apps/screen-sharing-bench/scripts/run-installed.sh tier2-report --runs "$RUNNER_TEMP/runs" \
            --run-id "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/report/report.json" \
            --markdown "$RUNNER_TEMP/report/summary.md" > /dev/null
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ env.TIER2_ARTIFACTS }}-report
          path: ${{ runner.temp }}/report
