name: CI

on:
  workflow_call:
    inputs:
      base:
        description: Check the changes since this commit. Leave empty to check everything.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      base:
        description: Check the changes since this commit. Leave empty to check everything.
        type: string
        default: ""

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      range: ${{ steps.range.outputs.range }}
      swift: ${{ steps.plan.outputs.swift }}
      net: ${{ steps.plan.outputs.net }}
      chrome: ${{ steps.plan.outputs.chrome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Resolve the changes to check
        id: range
        env:
          BASE: ${{ inputs.base }}
        run: |
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "range=--all" >> "$GITHUB_OUTPUT"
            echo "Checking everything"
          else
            echo "range=--base=$BASE" >> "$GITHUB_OUTPUT"
            echo "Checking changes since $BASE"
          fi
      - name: Plan the jobs
        id: plan
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          swift="$(node scripts/check.mjs "$RANGE" --lanes=swift-style,swift --list)"
          echo "swift=$([[ -n "$swift" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$RANGE" == --all ]]; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "${RANGE#--base=}" HEAD)"
          fi
          touches() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          echo "net=$(touches '^(packages/net/|rust-toolchain\.toml|scripts/net-|scripts/build-net-swift\.sh|packages/devtools/src/(artifact-lock|net-artifact|net-build)\.ts|\.github/workflows/ci\.yml|\.github/actions/setup-rust/)')" >> "$GITHUB_OUTPUT"
          echo "chrome=$(touches '^(packages/automation/|\.github/workflows/(ci|_test-chrome)\.yml)')" >> "$GITHUB_OUTPUT"
          {
            echo "### Planned checks"
            echo
            echo "- JavaScript checks: always"
            echo "- Swift checks: $([[ -n "$swift" ]] && tr '\n' ' ' <<<"$swift" || echo none)"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: packages/net
      - run: bun install --frozen-lockfile
      - run: node scripts/check.mjs "${{ needs.plan.outputs.range }}" --lanes=javascript
      - uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce
        if: always() && !cancelled()
        with:
          report_paths: "**/tmp/junit.xml"
          check_name: Test results
          require_tests: false
          detailed_summary: true
          include_passed: false
      - name: Show the check logs
        if: failure() || cancelled()
        run: |
          for log in tmp/build/check/*.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() || cancelled()
        with:
          name: check-logs-${{ github.job }}
          path: tmp/build/check/*.log
          if-no-files-found: ignore
          retention-days: 7

  checks-swift:
    needs: plan
    if: needs.plan.outputs.swift == 'true'
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          clean: true
          set-safe-directory: false
      - name: Select full Xcode
        run: echo "DEVELOPER_DIR=$(scripts/release/resolve-xcode.sh)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - run: node scripts/check.mjs "${{ needs.plan.outputs.range }}" --lanes=swift-style,swift
      - name: Show the check logs
        if: failure() || cancelled()
        run: |
          for log in tmp/build/check/*.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() || cancelled()
        with:
          name: check-logs-${{ github.job }}
          path: tmp/build/check/*.log
          if-no-files-found: ignore
          retention-days: 7

  test-net:
    needs: plan
    if: needs.plan.outputs.net == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: packages/net
      - run: bun install --frozen-lockfile
      - run: bun run net:test

  e2e-net:
    needs: plan
    if: needs.plan.outputs.net == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - name: Reserve tunnel fixture listener ports
        run: |
          tunnel_reserved_ports="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${tunnel_reserved_ports:+${tunnel_reserved_ports},}30000-34999,47000-48999"
      - run: bun run net:e2e

  test-chrome:
    needs: plan
    if: needs.plan.outputs.chrome == 'true'
    uses: ./.github/workflows/_test-chrome.yml
