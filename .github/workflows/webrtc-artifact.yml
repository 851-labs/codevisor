name: Native WebRTC Artifact

# Manual until the source build and generated notices have been reviewed.
# This job uploads a candidate; it does not publish or change SwiftPM pins.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-webrtc-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read pinned tools
        id: tools
        run: |
          node -e 'const p=JSON.parse(require("fs").readFileSync("scripts/webrtc-build.lock.json")); console.log("python="+p.pythonVersion); console.log("xcode="+p.xcodeVersion)' >> "$GITHUB_OUTPUT"
      # actions/setup-python has no macOS builds for CPython 3.12 security
      # releases (python.org stopped publishing installers), so the exact pin
      # the recipe enforces could never be installed there. uv installs it from
      # python-build-standalone; the activated venv puts it first on PATH.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ steps.tools.outputs.python }}
          activate-environment: true
          enable-cache: false
      - name: Build frameworks and dependency notices
        shell: bash
        run: |
          developer_dir="/Applications/Xcode_${{ steps.tools.outputs.xcode }}.app/Contents/Developer"
          if [[ ! -x "$developer_dir/usr/bin/xcodebuild" ]]; then
            developer_dir="$(scripts/release/resolve-xcode.sh)"
          fi
          # The recipe still enforces the exact pinned version before fetching.
          DEVELOPER_DIR="$developer_dir" node scripts/build-webrtc.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-webrtc-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            tmp/webrtc-source/*/artifacts/WebRTC.xcframework.zip
            tmp/webrtc-source/*/artifacts/manifest.json
            tmp/webrtc-source/*/artifacts/revisions.txt
            tmp/webrtc-source/*/artifacts/*-gn-args.txt
            tmp/webrtc-source/*/artifacts/notices-*/LICENSE.md
