name: Native WebRTC Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Publish the build to R2 as this version (152.0.0-codevisor.N); leave empty to only build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: native-webrtc-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          set-safe-directory: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Read pinned tools
        id: tools
        run: |
          node -e 'const p=JSON.parse(require("fs").readFileSync("scripts/webrtc-build.lock.json")); console.log("python="+p.pythonVersion); console.log("xcode="+p.xcodeVersion)' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        with:
          python-version: ${{ steps.tools.outputs.python }}
          activate-environment: true
          enable-cache: false
      - name: Build frameworks and dependency notices
        shell: bash
        run: |
          developer_dir="/Applications/Xcode_${{ steps.tools.outputs.xcode }}.app/Contents/Developer"
          if [[ ! -x "$developer_dir/usr/bin/xcodebuild" ]]; then
            developer_dir="$(scripts/release/resolve-xcode.sh)"
          fi
          DEVELOPER_DIR="$developer_dir" node scripts/build-webrtc.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-webrtc-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            tmp/webrtc-source/*/artifacts/WebRTC.xcframework.zip
            tmp/webrtc-source/*/artifacts/manifest.json
            tmp/webrtc-source/*/artifacts/revisions.txt
            tmp/webrtc-source/*/artifacts/*-gn-args.txt
            tmp/webrtc-source/*/artifacts/notices-*/LICENSE.md
      - name: Clean persistent runner workspace
        if: always()
        run: rm -rf tmp/webrtc-source

  publish:
    needs: build
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-webrtc-candidate
          path: dist/webrtc
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_API_ENDPOINT }}
          VERSION: ${{ inputs.version }}
        run: scripts/release/publish-webrtc.sh "$VERSION" dist/webrtc
