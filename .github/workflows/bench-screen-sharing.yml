name: Bench screen sharing

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: nightly records a baseline run (main only); adhoc records nothing the gate reads
        required: false
        default: adhoc
        type: choice
        options: [adhoc, nightly]
      scenes:
        description: Comma-separated Tier 1 scenes for a custom run; leave both lists empty for the nightly plan
        required: false
        default: ""
        type: string
      networks:
        description: Comma-separated Tier 1 networks for a custom run (empty with scenes set means N0,N3)
        required: false
        default: ""
        type: string
      plans:
        description: Tier 1 plans to run, comma-separated (core-v2, gate-v2, matrix-v2); empty runs all three
        required: false
        default: ""
        type: string
      encoder:
        description: Engine v2 encoder for a custom Tier 1 run, vt (VideoToolbox, codevisor-v2, as the baselines) or vcp (codevisor-v2-vcp)
        required: false
        default: vt
        type: choice
        options: [vt, vcp]
      source:
        description: Frame source for a custom run (own-window needs tamale's GUI session unlocked)
        required: false
        default: synthetic
        type: choice
        options: [synthetic, own-window]
      calibration:
        description: Also run the calibration workflow (C1, C2) on both minis
        required: false
        default: false
        type: boolean
      tier2:
        description: Also run the nightly Tier 2 (Codevisor vs Apple HP, every scene in two dispatches)
        required: false
        default: false
        type: boolean
      tier1:
        description: Run Tier 1 (off only to try the calibration or Tier 2 jobs on their own)
        required: false
        default: true
        type: boolean
      tier2_a_scenes:
        description: Scenes of the nightly Tier 2's first dispatch; empty runs idle-cursor, typing, scroll and window-drag
        required: false
        default: ""
        type: string
      tier2_b_scenes:
        description: Scenes of the nightly Tier 2's second dispatch; empty picks the night's (alternating N0 and N3)
        required: false
        default: ""
        type: string
      encode_lab:
        description: Run only the encoder lab with these semicolon-separated configs (see encode-lab --help)
        required: false
        default: ""
        type: string
      encode_lab_options:
        description: Other encode-lab options, such as --scenes scroll,typing --duration 8
        required: false
        default: ""
        type: string
      lab:
        description: Run only this lab command on one mini, as <tamale|croissant> <subcommand> [--option value …]
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - packages/swift/ScreenSharing/**
      - apps/screen-sharing-bench/**
      - packages/net/crates/codevisor-media/**
      - packages/net/crates/codevisor-net/**
      - packages/net/crates/codevisor-net-ffi/**
      - .github/workflows/bench-screen-sharing.yml

permissions:
  contents: read

env:
  TIER1_DURATION: "30"
  TIER1_WARM_UP: "10"
  TIER1_REPETITIONS: "3"

jobs:
  plan:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      trigger: ${{ steps.plan.outputs.trigger }}
      preflight: ${{ steps.plan.outputs.preflight }}
      own_window: ${{ steps.plan.outputs.own_window }}
      publish: ${{ steps.plan.outputs.publish }}
      tier2: ${{ steps.plan.outputs.tier2 }}
      tier2_a_scenes: ${{ steps.plan.outputs.tier2_a_scenes }}
      tier2_b_scenes: ${{ steps.plan.outputs.tier2_b_scenes }}
      tier1: ${{ steps.plan.outputs.tier1 }}
      calibration: ${{ steps.plan.outputs.calibration }}
      encode_lab: ${{ steps.plan.outputs.encode_lab }}
      lab: ${{ steps.plan.outputs.lab }}
    steps:
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
          SCENES: ${{ inputs.scenes }}
          NETWORKS: ${{ inputs.networks }}
          SOURCE: ${{ inputs.source }}
          TIER2_INPUT: ${{ inputs.tier2 }}
          CALIBRATION_INPUT: ${{ inputs.calibration }}
          ENCODE_LAB: ${{ inputs.encode_lab }}
          LAB: ${{ inputs.lab }}
          NIGHTLY_TIER2: ${{ vars.SCREEN_SHARING_BENCH_NIGHTLY_TIER2 }}
          TIER2_A_SCENES: ${{ inputs.tier2_a_scenes }}
          TIER2_B_SCENES: ${{ inputs.tier2_b_scenes }}
          TIER1_INPUT: ${{ inputs.tier1 }}
        run: |
          run=true mode=nightly trigger=$EVENT publish=false tier2=false calibration=false own_window=false encode_lab=false lab=false
          preflight="--quiet --allow-locked"
          pacific_cron="0 10 * * *"
          [[ "$(TZ=America/Los_Angeles date +%z)" == -0800 ]] && pacific_cron="0 11 * * *"
          case "$EVENT" in
            schedule)
              [[ "$CRON" == "$pacific_cron" ]] || run=false
              trigger=nightly
              [[ "$run" == true && "$NIGHTLY_TIER2" == true ]] && tier2=true calibration=true
              ;;
            workflow_dispatch)
              trigger=$KIND
              tier2=$TIER2_INPUT calibration=$CALIBRATION_INPUT
              [[ -n "$SCENES$NETWORKS" ]] && mode=custom trigger=adhoc
              [[ "$mode" == custom && "$SOURCE" == own-window ]] && own_window=true preflight="--quiet"
              [[ -n "$ENCODE_LAB" ]] && run=false encode_lab=true
              [[ -n "$LAB" ]] && run=false encode_lab=false lab=true
              ;;
          esac
          [[ "$GITHUB_REF" == refs/heads/main && "$EVENT" != pull_request ]] && publish=true
          [[ "$trigger" == nightly && "$publish" != true ]] && trigger=adhoc
          tier2_a_scenes=${TIER2_A_SCENES:-idle-cursor,typing,scroll,window-drag}
          tier2_b_scenes=video,test-cards,input
          (($(date -u +%s) / 86400 % 2)) && tier2_b_scenes=input,scroll@N3,typing@N3
          [[ -n "$TIER2_B_SCENES" ]] && tier2_b_scenes=$TIER2_B_SCENES
          tier1=true
          [[ "$EVENT" == workflow_dispatch && "$TIER1_INPUT" == false ]] && tier1=false
          {
            echo "run=$run"; echo "mode=$mode"; echo "trigger=$trigger"; echo "preflight=$preflight"
            echo "publish=$publish"; echo "tier2=$tier2"; echo "calibration=$calibration"; echo "own_window=$own_window"
            echo "encode_lab=$encode_lab"; echo "lab=$lab"; echo "tier2_a_scenes=$tier2_a_scenes"; echo "tier2_b_scenes=$tier2_b_scenes"; echo "tier1=$tier1"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: >-
      ${{ needs.plan.outputs.run == 'true' && github.event_name != 'pull_request'
      && (needs.plan.outputs.tier1 == 'true' || needs.plan.outputs.tier2 == 'true') }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - uses: ./.github/actions/keep-screen-sharing-bench

  tier1:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.tier1 == 'true' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 150
    concurrency:
      group: screen-sharing-bench
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TIER1_TRIGGER: ${{ needs.plan.outputs.trigger }}
      SCENES: ${{ inputs.scenes }}
      NETWORKS: ${{ inputs.networks }}
      TIER1_SOURCE: ${{ inputs.source || 'synthetic' }}
      TIER1_PLANS: ${{ inputs.plans }}
      TIER1_ENCODER: ${{ inputs.encoder || 'vt' }}
      MODE: ${{ needs.plan.outputs.mode }}
      PREFLIGHT: ${{ needs.plan.outputs.preflight }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SCENES" =~ ^([a-z-]+(,[a-z-]+)*)?$ ]] || { echo "scenes must be a comma-separated list"; exit 1; }
          [[ "$NETWORKS" =~ ^(N[0-7](,N[0-7])*)?$ ]] || { echo "networks must be like N0,N3"; exit 1; }
          plan="(core-v2|gate-v2|matrix-v2)"
          [[ -z "$TIER1_PLANS" || "$TIER1_PLANS" =~ ^$plan(,$plan)*$ ]] || { echo "plans must be core-v2, gate-v2 or matrix-v2"; exit 1; }
          if [[ "$MODE" == custom && -n "$TIER1_PLANS" ]]; then
            echo "::warning::plans applies to the nightly plan only; a run with scenes or networks set is one custom report"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/fetch-screen-sharing-bench
        with:
          name: bench-app
      - name: Install it where the permission grants are (own-window only)
        if: ${{ needs.plan.outputs.own_window == 'true' }}
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Wait for a quiet machine (C5)
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/run-installed.sh preflight $PREFLIGHT > "$RUNNER_TEMP/results/preflight.json"
      - name: Run Tier 1
        run: |
          export TIER1_SCENES="$SCENES" TIER1_NETWORKS="${NETWORKS:-N0,N3}"
          caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier1.sh "$MODE" "$RUNNER_TEMP/results"
      - name: Record the reports on benchmark-results
        if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
        run: apps/screen-sharing-bench/scripts/publish.sh "$RUNNER_TEMP/results"
      - name: Write the summary
        if: ${{ !cancelled() }}
        run: apps/screen-sharing-bench/scripts/summary.sh "$RUNNER_TEMP/results" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tier1-tamale
          path: ${{ runner.temp }}/results
          retention-days: 90

  stop-gate:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: screen-sharing-bench-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Stop the gate of a closed or merged pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "Pull request $PR is closed; this job took over its gate group."

  gate:
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 100
    concurrency:
      group: screen-sharing-bench-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
    env:
      TIER1_TRIGGER: pull_request
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Note any bench job the gate waited for
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/gate-wait.sh > "$RUNNER_TEMP/results/waited.md"
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Wait for a quiet machine (C5)
        run: apps/screen-sharing-bench/scripts/run-installed.sh preflight --quiet --allow-locked > "$RUNNER_TEMP/results/preflight.json"
      - name: Run the gate cells twice
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier1.sh pr_gate "$RUNNER_TEMP/results"
      - name: Compare with the nightly baseline
        run: |
          results="$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/results-branch.sh index "$results/index.jsonl"
          status=0
          apps/screen-sharing-bench/scripts/run-installed.sh gate --index "$results/index.jsonl" \
            --first "$results/first-v2.json" --second "$results/second-v2.json" > "$results/gate-v2.md" || status=1
          cat "$results/gate-v2.md" "$results/waited.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gate-tamale
          path: ${{ runner.temp }}/results
          retention-days: 30

  calibration:
    needs: [plan, build, tier1]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.calibration == 'true' }}
    uses: ./.github/workflows/bench-screen-sharing-calibration.yml
    secrets: inherit

  tier2-a:
    needs: [plan, build, tier1, calibration]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.run == 'true'
      && needs.plan.outputs.tier2 == 'true' }}
    uses: ./.github/workflows/bench-screen-sharing-tier2.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit
    with:
      label: a
      bench-artifact: bench-app
      scenes: ${{ needs.plan.outputs.tier2_a_scenes }}
      systems: apple-hp,codevisor-v2
      repetitions: "2"
      duration: "30"
      input-events: "40"

  tier2-b:
    needs: [plan, build, tier2-a]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.run == 'true'
      && needs.plan.outputs.tier2 == 'true' }}
    uses: ./.github/workflows/bench-screen-sharing-tier2.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit
    with:
      label: b
      bench-artifact: bench-app
      scenes: ${{ needs.plan.outputs.tier2_b_scenes }}
      systems: apple-hp,codevisor-v2
      repetitions: "2"
      duration: "30"
      input-events: "40"

  tier2-summary:
    needs: [plan, build, tier2-a, tier2-b]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.run == 'true'
      && needs.plan.outputs.tier2 == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/fetch-screen-sharing-bench
        with:
          name: bench-app
      - uses: ./.github/actions/tier2-dispatches-summary

  encode-lab:
    needs: plan
    if: ${{ needs.plan.outputs.encode_lab == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 30
    concurrency:
      group: screen-sharing-lab-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      CONFIGS: ${{ inputs.encode_lab }}
      OPTIONS: ${{ inputs.encode_lab_options }}
    steps:
      - name: Check the inputs
        run: |
          configs='^[a-zA-Z0-9=,.;@_-]+$' options='^[a-zA-Z0-9 ,.-]*$'
          [[ "$CONFIGS" =~ $configs ]] || { echo "encode_lab must be key=value configs"; exit 1; }
          [[ "$OPTIONS" =~ $options ]] || { echo "encode_lab_options must be plain options"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Wait for a quiet machine (C5)
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/run-installed.sh preflight --quiet --allow-locked > "$RUNNER_TEMP/results/preflight.json"
      - name: Run the encoder lab
        run: |
          read -ra options <<< "$OPTIONS"
          caffeinate -d -i -s apps/screen-sharing-bench/scripts/run-installed.sh encode-lab --configs "$CONFIGS" \
            ${options[@]+"${options[@]}"} --output "$RUNNER_TEMP/results/encode-lab.json" \
            --markdown "$RUNNER_TEMP/results/encode-lab.md" > /dev/null
          cat "$RUNNER_TEMP/results/encode-lab.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encode-lab-tamale
          path: ${{ runner.temp }}/results
          retention-days: 90

  lab:
    needs: plan
    if: ${{ needs.plan.outputs.lab == 'true' }}
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ startsWith(inputs.lab, 'croissant ') && 'croissant' || 'tamale' }}
    timeout-minutes: 30
    concurrency:
      group: screen-sharing-lab-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      LAB: ${{ inputs.lab }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$LAB" =~ ^(tamale|croissant)\ [a-z0-9-]+(\ [a-zA-Z0-9=,.:/_-]+)*$ ]] || {
            echo "lab must be <tamale|croissant> <subcommand> [--option value …] in plain characters"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Run the lab command
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/lab.sh "$RUNNER_TEMP/results" $LAB
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lab
          path: ${{ runner.temp }}/results
