name: Tunnel native artifacts

# Builds the codevisor-net native artifacts for a source stamp (Node addons
# for linux x64/arm64 and darwin arm64, the Swift xcframework) as GitHub
# artifacts with sha256 files, and fails if the committed uniffi Swift
# bindings drifted. Builds never depend on these: scripts/net-artifact.mjs
# builds from source on a cache miss. Publishing to
# updates.codevisor.dev/dev-artifacts/net/<stamp>/ and downloading before
# building are a follow-up (docs/plans/codevisor-tunnel.md).
on:
  push:
    branches: [main]
    paths:
      - "packages/net/**"
      - "scripts/net-build.lock.json"
      - "scripts/build-net-swift.sh"
      - ".github/workflows/net-artifact.yml"
  workflow_dispatch:

concurrency:
  group: net-artifact-${{ github.sha }}

jobs:
  node-addon:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - run: bun --version >/dev/null 2>&1 || npm install -g bun
      - run: node scripts/net-artifact.mjs ensure-node
      - run: echo "stamp=$(node scripts/net-artifact.mjs stamp)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: net-node-${{ matrix.runner }}
          path: packages/net/native/
          if-no-files-found: error
          retention-days: 14

  apple:
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          set-safe-directory: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - run: node scripts/net-artifact.mjs ensure-node
      - run: node scripts/net-artifact.mjs ensure-swift
      # The committed uniffi bindings must match what this source generates.
      - run: git diff --exit-code packages/swift/CodevisorNet/Sources/CodevisorNet/Generated/
      - name: Package
        run: |
          stamp="$(node scripts/net-artifact.mjs stamp)"
          mkdir -p dist/net/"$stamp"
          ditto -c -k --keepParent "$(readlink packages/swift/Frameworks/CodevisorNetFFI.xcframework)" \
            dist/net/"$stamp"/CodevisorNetFFI.xcframework.zip
          cp packages/net/native/darwin-arm64/codevisor_net.node dist/net/"$stamp"/codevisor_net-darwin-arm64.node
          (cd dist/net/"$stamp" && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: net-apple
          path: dist/net/
          if-no-files-found: error
          retention-days: 14
