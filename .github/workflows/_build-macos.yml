name: Build macOS

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        type: string
        required: true
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true
      publish:
        description: Upload release artifacts, debug symbols, and caches
        type: boolean
        default: true
    outputs:
      ghostty_stamp:
        value: ${{ jobs.build.outputs.ghostty_stamp }}

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  CODEVISOR_SOURCE_REVISION: ${{ github.sha }}

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      ghostty_stamp: ${{ steps.package-ghostty.outputs.stamp }}
    env:
      VERSION: ${{ inputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          set-safe-directory: false
      - name: Select full Xcode
        run: |
          developer_dir="$(scripts/release/resolve-xcode.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" xcrun swift --version
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - name: Restore GhosttyKit cache
        id: ghosttykit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/macos/Frameworks/GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('apps/macos/scripts/build-ghostty.sh') }}
      - name: Build GhosttyKit
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        run: apps/macos/scripts/build-ghostty.sh
      - name: Save GhosttyKit cache
        if: inputs.publish && steps.ghosttykit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/macos/Frameworks/GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('apps/macos/scripts/build-ghostty.sh') }}
      - name: Verify GhosttyKit
        run: test -d apps/macos/Frameworks/GhosttyKit.xcframework
      - name: Package shared GhosttyKit development artifact
        id: package-ghostty
        run: |
          archive="$(scripts/release/package-ghosttykit.sh dist/release)"
          stamp="$(basename "$archive")"
          stamp="${stamp#GhosttyKit-}"
          stamp="${stamp%.tar.gz}"
          [[ "$stamp" =~ ^[0-9a-f]{40}-[0-9a-f]{16}$ ]] || {
            echo "Invalid packaged Ghostty stamp: $stamp" >&2
            exit 1
          }
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Resolve Xcode cache version
        id: xcode-cache-version
        run: echo "value=$({ xcodebuild -version; echo "$GITHUB_WORKSPACE"; } | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode DerivedData cache
        id: xcode-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: dist/release/DerivedData
          key: codevisor-xcode-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-${{ hashFiles('apps/macos/Codevisor.xcodeproj/**', 'apps/macos/Codevisor/**', 'packages/swift/**', 'apps/macos/scripts/build-ghostty.sh', 'scripts/release/build-macos-xcode.sh') }}
          restore-keys: |
            codevisor-xcode-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          : "${APPLE_CERTIFICATE_BASE64:?Developer ID certificate secret is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Developer ID certificate password secret is required}"
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/codevisor-signing.keychain-db"
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
      - name: Build the tunnel xcframework
        run: node scripts/net-artifact.mjs ensure-swift
      - name: Build the screen sharing bench app
        run: swift build --package-path packages/swift --product CodevisorBench
      - name: Build and sign macOS app artifacts
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          CODEVISOR_UNSIGNED_APP_ARCHIVE_OUTPUT: dist/release/build-inputs/codevisor-unsigned-app.zip
          CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON }}
          CODEVISOR_LINEAR_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_LINEAR_OAUTH_CLIENT_JSON }}
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" = 3 ] && exit 1
            echo "bun install failed (attempt $attempt); retrying in 20s" >&2
            sleep 20
          done
          : "${APPLE_CODESIGN_IDENTITY:?Developer ID signing identity secret is required}"
          scripts/release/build-macos-app.sh "$VERSION" dist/release
      - name: Upload macOS debug symbols to Sentry
        if: inputs.publish
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not configured; skipping Sentry debug-symbol upload."
            exit 0
          fi
          symbols_path="dist/release/DerivedData/Build/Products/Release/Codevisor.app.dSYM"
          if [[ ! -d "$symbols_path" ]]; then
            echo "Expected macOS debug symbols at $symbols_path." >&2
            exit 1
          fi
          bunx @sentry/cli@3.6.2 debug-files upload \
            --org 851-labs \
            --project codevisor-macos \
            "$symbols_path"
      - name: Restore unsigned app before caching DerivedData
        run: |
          app_parent="dist/release/DerivedData/Build/Products/Release"
          rm -rf "$app_parent/Codevisor.app"
          ditto -x -k dist/release/build-inputs/codevisor-unsigned-app.zip "$app_parent"
      - name: Save Xcode DerivedData cache
        if: inputs.publish && steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: dist/release/DerivedData
          key: codevisor-xcode-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-${{ hashFiles('apps/macos/Codevisor.xcodeproj/**', 'apps/macos/Codevisor/**', 'packages/swift/**', 'apps/macos/scripts/build-ghostty.sh', 'scripts/release/build-macos-xcode.sh') }}
      - name: Build ARM macOS server archive
        run: scripts/release/build-server-archive.sh "$VERSION" dist/release darwin-arm64 dist/release/work/app-server-runtimes/darwin-arm64
      - name: Upload macOS release artifacts
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codevisor-macos
          path: |
            dist/release/Codevisor-macOS*.zip
            dist/release/Codevisor-macOS*.zip.sha256
            dist/release/Codevisor-*.dmg
            dist/release/Codevisor-*.dmg.sha256
            dist/release/codevisor-server-*.tar.gz
            dist/release/codevisor-server-*.tar.gz.sha256
            dist/release/GhosttyKit-*.tar.gz
            dist/release/GhosttyKit-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material and clean persistent runner
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/codevisor-signing.keychain-db"
          if [[ -f "$RUNNER_TEMP/original-keychains.txt" ]]; then
            security list-keychains -d user -s $(tr -d '"' < "$RUNNER_TEMP/original-keychains.txt") || true
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-certificate.p12"
          rm -f "$RUNNER_TEMP/original-keychains.txt"
          rm -rf dist/release node_modules
