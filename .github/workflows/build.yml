name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  CODEVISOR_SOURCE_REVISION: ${{ github.sha }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.build.outputs.build }}
    steps:
      - name: Require main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Build runs only on main." >&2; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - name: Resolve the build number
        id: build
        run: echo "build=$(node scripts/release/alpha-release.mjs build-number "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
      - name: Resolve the next stable marketing version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"
          latest="${latest#v}"
          if [[ ! "$latest" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest stable tag is not a numeric semantic version: $latest" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Alpha $version for $GITHUB_SHA"

  build-server-linux-x64:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - run: scripts/release/build-server-archive.sh "$VERSION" dist/release
        env:
          CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON }}
          CODEVISOR_LINEAR_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_LINEAR_OAUTH_CLIENT_JSON }}
      - run: scripts/release/package-server-js.sh dist/release/build-inputs/codevisor-server-js.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codevisor-server-js
          path: dist/release/build-inputs/codevisor-server-js.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codevisor-server-linux-x64
          path: |
            dist/release/codevisor-server-*.tar.gz
            dist/release/codevisor-server-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-server-linux-arm64:
    needs: metadata
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - run: scripts/release/build-server-archive.sh "$VERSION" dist/release
        env:
          CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON }}
          CODEVISOR_LINEAR_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_LINEAR_OAUTH_CLIENT_JSON }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codevisor-server-linux-arm64
          path: |
            dist/release/codevisor-server-*.tar.gz
            dist/release/codevisor-server-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-server-macos-x64:
    needs: [metadata, build-server-linux-x64]
    runs-on: macos-26-intel
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select full Xcode
        run: echo "DEVELOPER_DIR=$(scripts/release/resolve-xcode.sh)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: codevisor-server-js
          path: dist/release/build-inputs
      - name: Install node-gyp for native addons
        run: |
          node_gyp_version="$(node -p 'require("./package.json").devDependencies["node-gyp"]')"
          npm install --global --no-audit --no-fund "node-gyp@$node_gyp_version"
          echo "CODEVISOR_NODE_GYP=$(npm prefix --global)/bin/node-gyp" >> "$GITHUB_ENV"
      - name: Build Intel macOS server archive
        env:
          CODEVISOR_PREBUILT_SERVER_JS: dist/release/build-inputs/codevisor-server-js.tar.gz
          CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_GOOGLE_OAUTH_CLIENT_JSON }}
          CODEVISOR_LINEAR_OAUTH_CLIENT_JSON: ${{ secrets.CODEVISOR_LINEAR_OAUTH_CLIENT_JSON }}
        run: |
          runtime_dir="dist/release/work/server-runtime-darwin-x64"
          scripts/release/build-server-runtime.sh "$VERSION" "$runtime_dir" darwin-x64
          scripts/release/build-server-archive.sh "$VERSION" dist/release darwin-x64 "$runtime_dir"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codevisor-server-macos-x64
          path: |
            dist/release/codevisor-server-darwin-x64.tar.gz
            dist/release/codevisor-server-darwin-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: metadata
    uses: ./.github/workflows/_build-macos.yml
    with:
      runner: ${{ vars.MACOS_RUNNER || '["self-hosted", "macOS", "ARM64", "codevisor-macos-arm64"]' }}
      version: ${{ needs.metadata.outputs.version }}
      build-number: ${{ needs.metadata.outputs.build }}
    secrets: inherit

  build-ios:
    needs: metadata
    uses: ./.github/workflows/_build-ios.yml
    with:
      runner: ${{ vars.MACOS_RUNNER || '["self-hosted", "macOS", "ARM64", "codevisor-macos-arm64"]' }}
      version: ${{ needs.metadata.outputs.version }}
      build-number: ${{ needs.metadata.outputs.build }}
    secrets: inherit

  provenance:
    needs:
      [
        metadata,
        build-server-linux-x64,
        build-server-linux-arm64,
        build-server-macos-x64,
        build-macos,
        build-ios
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Record build provenance
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD: ${{ needs.metadata.outputs.build }}
          GHOSTTY_STAMP: ${{ needs.build-macos.outputs.ghostty_stamp }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg source_sha "$GITHUB_SHA" \
            --arg build_number "$BUILD" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg ghostty_stamp "$GHOSTTY_STAMP" \
            '{channel: "alpha", version: $version, source_sha: $source_sha, build_number: $build_number, run_id: $run_id, ghostty_stamp: $ghostty_stamp}' \
            > release-provenance.json
          cat release-provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codevisor-release-provenance
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 14
