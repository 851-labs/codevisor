name: Build

# Builds, tests, and signs every Codevisor artifact (macOS app, servers, iOS
# app) for each push to main. It makes no Apple distribution calls: Publish
# Alpha notarizes and ships the newest successful build on a schedule, so
# Apple's daily notarization and TestFlight limits never depend on how often
# main moves. Stable and Beta later promote those same published bytes.
#
# Outputs (run artifacts, kept 14 days):
#   codevisor-macos             signed app ZIP/DMG, darwin-arm64 server, GhosttyKit
#   codevisor-server-*          Linux and Intel macOS server archives
#   codevisor-ios               signed IPA and archive
#   codevisor-release-provenance version, build number, and source of this run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build
  # Finish the active run. GitHub keeps one pending run and replaces it with
  # each newer push, so intermediate commits are skipped.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CODEVISOR_SOURCE_REVISION: ${{ github.sha }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.build.outputs.build }}
    steps:
      # Self-hosted runners must only build trusted main commits.
      - name: Require main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Build runs only on main." >&2; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Resolve the build number
        id: build
        run: echo "build=$(node scripts/release/alpha-release.mjs build-number "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
      - name: Resolve the next stable marketing version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags become visible before a release's remaining publication steps
          # finish, so a push during that window still receives the next unused
          # version instead of rebuilding the just-tagged one.
          latest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"
          latest="${latest#v}"
          if [[ ! "$latest" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest stable tag is not a numeric semantic version: $latest" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Alpha $version for $GITHUB_SHA"

  checks:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:js

  server-linux-x64:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: scripts/release/build-server-archive.sh "$VERSION" dist/release
      # The compiled JavaScript is platform independent. The Intel Mac reuses
      # it instead of repeating the TypeScript build, which takes minutes there.
      - run: scripts/release/package-server-js.sh dist/release/build-inputs/codevisor-server-js.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-server-js
          path: dist/release/build-inputs/codevisor-server-js.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-server-linux-x64
          path: |
            dist/release/codevisor-server-*.tar.gz
            dist/release/codevisor-server-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  server-linux-arm64:
    needs: metadata
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: scripts/release/build-server-archive.sh "$VERSION" dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-server-linux-arm64
          path: |
            dist/release/codevisor-server-*.tar.gz
            dist/release/codevisor-server-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # The macOS app is Apple silicon only; this Intel Mac builds only the
  # standalone darwin-x64 server. It does just the platform-specific work:
  # native addons, the bundled Node, and the archive. The JavaScript comes
  # from server-linux-x64, and a standalone node-gyp replaces the workspace
  # install that only the TypeScript build needed.
  server-macos-x64:
    needs: [metadata, server-linux-x64]
    runs-on: [self-hosted, macOS, X64, codevisor-macos-x64]
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          # Native self-hosted runners own their checkouts; no global trust entry is needed.
          set-safe-directory: false
      - name: Select full Xcode
        run: echo "DEVELOPER_DIR=$(scripts/release/resolve-xcode.sh)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: codevisor-server-js
          path: dist/release/build-inputs
      - name: Install node-gyp for native addons
        run: |
          node_gyp_version="$(node -p 'require("./package.json").devDependencies["node-gyp"]')"
          npm install --prefix "$RUNNER_TEMP/node-gyp" --no-audit --no-fund "node-gyp@$node_gyp_version"
          echo "CODEVISOR_NODE_GYP=$RUNNER_TEMP/node-gyp/node_modules/.bin/node-gyp" >> "$GITHUB_ENV"
      - name: Build Intel macOS server archive
        env:
          CODEVISOR_PREBUILT_SERVER_JS: dist/release/build-inputs/codevisor-server-js.tar.gz
        run: |
          runtime_dir="dist/release/work/server-runtime-darwin-x64"
          scripts/release/build-server-runtime.sh "$VERSION" "$runtime_dir" darwin-x64
          scripts/release/build-server-archive.sh "$VERSION" dist/release darwin-x64 "$runtime_dir"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-server-macos-x64
          path: |
            dist/release/codevisor-server-darwin-x64.tar.gz
            dist/release/codevisor-server-darwin-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Clean persistent runner workspace
        if: always()
        run: rm -rf dist/release "$RUNNER_TEMP/node-gyp"

  macos:
    needs: metadata
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    outputs:
      ghostty_stamp: ${{ steps.package-ghostty.outputs.stamp }}
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          # Native self-hosted runners own their checkouts; no global trust entry is needed.
          set-safe-directory: false
      - name: Select full Xcode
        run: |
          developer_dir="$(scripts/release/resolve-xcode.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" xcrun swift --version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Restore GhosttyKit cache
        id: ghosttykit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/macos/Frameworks/GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('apps/macos/scripts/build-ghostty.sh', 'apps/macos/patches/ghostty-libcpp-availability.patch') }}
      - name: Fetch Ghostty source
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        run: apps/macos/scripts/build-ghostty.sh --fetch-only
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        with:
          determinate: true
      # Ghostty's renderer compiles Metal shaders, and Xcode 16+ ships the
      # Metal Toolchain as a separately downloadable component. Idempotent: a
      # no-op once installed, so it only costs time on a fresh runner. Gated on
      # the GhosttyKit cache miss so warm builds skip it entirely.
      - name: Ensure Metal Toolchain
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build GhosttyKit
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        # NIX_CONFIG outranks the runner's nix.conf, whose access token was
        # written by nix-installer-action on FIRST install with that job's
        # ephemeral GITHUB_TOKEN. On a persistent self-hosted runner the
        # install is reused, the recorded token is long expired, and any
        # uncached github: flake input fails with 401 Bad credentials.
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: nix develop ./.repos/ghostty -c apps/macos/scripts/build-ghostty.sh
      - name: Save GhosttyKit cache
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/macos/Frameworks/GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('apps/macos/scripts/build-ghostty.sh', 'apps/macos/patches/ghostty-libcpp-availability.patch') }}
      - name: Verify GhosttyKit
        run: test -d apps/macos/Frameworks/GhosttyKit.xcframework
      - name: Package shared GhosttyKit development artifact
        id: package-ghostty
        run: |
          archive="$(scripts/release/package-ghosttykit.sh dist/release)"
          stamp="$(basename "$archive")"
          stamp="${stamp#GhosttyKit-}"
          stamp="${stamp%.tar.gz}"
          [[ "$stamp" =~ ^[0-9a-f]{40}-[0-9a-f]{16}$ ]] || {
            echo "Invalid packaged Ghostty stamp: $stamp" >&2
            exit 1
          }
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Resolve Xcode cache version
        id: xcode-cache-version
        # DerivedData embeds absolute paths, and each self-hosted runner has its
        # own workspace ($HOME differs per runner account). Keying on the
        # workspace keeps one runner from restoring another's DerivedData,
        # which fails with "There is no XCFramework found at /Users/<other>/…".
        run: echo "value=$({ xcodebuild -version; echo "$GITHUB_WORKSPACE"; } | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode DerivedData cache
        id: xcode-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dist/release/DerivedData
          key: codevisor-xcode-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-${{ hashFiles('apps/macos/Codevisor.xcodeproj/**', 'apps/macos/Codevisor/**', 'packages/swift/**', 'apps/macos/scripts/build-ghostty.sh', 'apps/macos/patches/ghostty-libcpp-availability.patch', 'scripts/release/build-macos-xcode.sh') }}
          restore-keys: |
            codevisor-xcode-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          : "${APPLE_CERTIFICATE_BASE64:?Developer ID certificate secret is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Developer ID certificate password secret is required}"
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/codevisor-signing.keychain-db"
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
      # Signed but not notarized: Publish Alpha notarizes only what it ships.
      - name: Build and sign macOS app artifacts
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          CODEVISOR_UNSIGNED_APP_ARCHIVE_OUTPUT: dist/release/build-inputs/codevisor-unsigned-app.zip
        run: |
          # Postinstall scripts download binaries (ffmpeg-static); a network timeout
          # there failed a whole Alpha build. Bounded retries, then fail.
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" = 3 ] && exit 1
            echo "bun install failed (attempt $attempt); retrying in 20s" >&2
            sleep 20
          done
          : "${APPLE_CODESIGN_IDENTITY:?Developer ID signing identity secret is required}"
          scripts/release/build-macos-app.sh "$VERSION" dist/release
      - name: Upload macOS debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not configured; skipping Sentry debug-symbol upload."
            exit 0
          fi
          symbols_path="dist/release/DerivedData/Build/Products/Release/Codevisor.app.dSYM"
          if [[ ! -d "$symbols_path" ]]; then
            echo "Expected macOS debug symbols at $symbols_path." >&2
            exit 1
          fi
          bunx @sentry/cli@3.6.2 debug-files upload \
            --org 851-labs \
            --project codevisor-macos \
            "$symbols_path"
      - name: Restore unsigned app before caching DerivedData
        run: |
          app_parent="dist/release/DerivedData/Build/Products/Release"
          rm -rf "$app_parent/Codevisor.app"
          ditto -x -k dist/release/build-inputs/codevisor-unsigned-app.zip "$app_parent"
      - name: Save Xcode DerivedData cache
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dist/release/DerivedData
          key: codevisor-xcode-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-${{ hashFiles('apps/macos/Codevisor.xcodeproj/**', 'apps/macos/Codevisor/**', 'packages/swift/**', 'apps/macos/scripts/build-ghostty.sh', 'apps/macos/patches/ghostty-libcpp-availability.patch', 'scripts/release/build-macos-xcode.sh') }}
      - name: Build ARM macOS server archive
        run: scripts/release/build-server-archive.sh "$VERSION" dist/release darwin-arm64 dist/release/work/app-server-runtimes/darwin-arm64
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-macos
          path: |
            dist/release/Codevisor-macOS*.zip
            dist/release/Codevisor-macOS*.zip.sha256
            dist/release/Codevisor-*.dmg
            dist/release/Codevisor-*.dmg.sha256
            dist/release/codevisor-server-*.tar.gz
            dist/release/codevisor-server-*.tar.gz.sha256
            dist/release/GhosttyKit-*.tar.gz
            dist/release/GhosttyKit-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material and clean persistent runner
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/codevisor-signing.keychain-db"
          if [[ -f "$RUNNER_TEMP/original-keychains.txt" ]]; then
            security list-keychains -d user -s $(tr -d '"' < "$RUNNER_TEMP/original-keychains.txt") || true
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-certificate.p12"
          rm -f "$RUNNER_TEMP/original-keychains.txt"
          rm -rf dist/release node_modules

  ios:
    needs: metadata
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CODEVISOR_BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
      CODEVISOR_APPLE_KEY_DIRECTORY: ${{ github.workspace }}/tmp/codevisor-ios-signing-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          # Native self-hosted runners own their checkouts; no global trust entry is needed.
          set-safe-directory: false
      - name: Select full Xcode
        run: echo "DEVELOPER_DIR=$(scripts/release/resolve-xcode.sh)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # SwiftTerm compiles Metal shaders, and Xcode 16+ ships the Metal
      # Toolchain as a separate component. A no-op once installed.
      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Archive and cloud-sign the iOS build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bun scripts/release/build-ios-testflight.mjs "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-ios
          path: |
            tmp/build/ios/testflight/export/Codevisor.ipa
            tmp/build/ios/testflight/export/Codevisor.xcarchive.zip
            tmp/build/ios/testflight/export/testflight-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Clean persistent runner workspace
        if: always()
        run: rm -rf tmp/build/ios/testflight "$CODEVISOR_APPLE_KEY_DIRECTORY"

  # Written only when every build job succeeded. Publish Alpha attaches it to
  # the Alpha release, which then serves as the record for Stable and Beta.
  provenance:
    needs: [metadata, checks, server-linux-x64, server-linux-arm64, server-macos-x64, macos, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Record build provenance
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD: ${{ needs.metadata.outputs.build }}
          GHOSTTY_STAMP: ${{ needs.macos.outputs.ghostty_stamp }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg source_sha "$GITHUB_SHA" \
            --arg build_number "$BUILD" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg ghostty_stamp "$GHOSTTY_STAMP" \
            '{channel: "alpha", version: $version, source_sha: $source_sha, build_number: $build_number, run_id: $run_id, ghostty_stamp: $ghostty_stamp}' \
            > release-provenance.json
          cat release-provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-release-provenance
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 14
