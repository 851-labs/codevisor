name: iOS TestFlight

on:
  workflow_call:
    inputs:
      operation:
        description: Build a local signed artifact or publish the artifact from this Alpha run.
        type: string
        required: true
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
    secrets:
      APPLE_TEAM_ID:
        required: true
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  testflight:
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 60
    env:
      CODEVISOR_BUILD_NUMBER: ${{ github.run_number }}
      CODEVISOR_SOURCE_REVISION: ${{ inputs.source_sha }}
      CODEVISOR_APPLE_KEY_DIRECTORY: ${{ github.workspace }}/tmp/codevisor-ios-signing-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require a trusted Alpha invocation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$CODEVISOR_SOURCE_REVISION" == "$GITHUB_SHA" ]]
          [[ "$OPERATION" == build || "$OPERATION" == publish ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          clean: true
      - name: Select full Xcode
        shell: bash
        run: echo "DEVELOPER_DIR=$(scripts/release/resolve-xcode.sh)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Archive and cloud-sign the internal iOS build
        if: inputs.operation == 'build'
        env:
          IOS_VERSION: ${{ inputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bun scripts/release/build-ios-testflight.mjs "$IOS_VERSION"
      - name: Retain the signed IPA and archive with symbols
        if: inputs.operation == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codevisor-ios
          path: |
            tmp/build/ios/testflight/export/Codevisor.ipa
            tmp/build/ios/testflight/export/Codevisor.xcarchive.zip
            tmp/build/ios/testflight/export/testflight-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Download the verified artifact from this Alpha run
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name codevisor-ios --dir tmp/build/ios/testflight/export
      - name: Upload and wait for internal TestFlight availability
        if: inputs.operation == 'publish'
        env:
          IOS_VERSION: ${{ inputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bun scripts/release/publish-ios-testflight.mjs "$IOS_VERSION"
      - name: Clean generated iOS artifacts on the persistent runner
        if: always()
        run: rm -rf tmp/build/ios/testflight "$CODEVISOR_APPLE_KEY_DIRECTORY"
