name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "24.x"

jobs:
  javascript:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check:js

  native:
    if: ${{ !github.event.pull_request.draft }}
    # PR code runs on an ephemeral hosted machine, without signing secrets.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Record native tools
        run: |
          xcodebuild -version
          xcrun swift --version
      - run: bun install --frozen-lockfile
      - name: Install the validated SwiftLint version
        run: |
          tool_dir="$RUNNER_TEMP/swiftlint-0.63.1"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --output "$tool_dir/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.63.1/portable_swiftlint.zip
          echo "0e6369741b694b701e9bd4e4fe9b408a5946d4bb076b79ea6ec2bce428475739  $tool_dir/swiftlint.zip" | shasum -a 256 -c -
          ditto -x -k "$tool_dir/swiftlint.zip" "$tool_dir"
          "$tool_dir/swiftlint" version
          echo "$tool_dir" >> "$GITHUB_PATH"
      - run: bun run swift:format:check
      - run: bun run swift:lint
      - run: bun run swift:test
      - run: bun run swift:test:macos-transcript
      - run: bun run swift:test:macos-composer
      - run: bun run build:macos
      - run: bun run swift:build:ios
      - run: bun run swift:test:ios-transcript
