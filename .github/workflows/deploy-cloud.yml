name: Deploy cloud

on:
  push:
    branches:
      - main
    paths:
      - "apps/cloud/**"
      - "packages/api/**"
      - "packages/cloud-crypto/**"
      - "bun.lock"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  # Never cancel a run mid-migration; queued runs wait their turn.
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "24.x"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, typecheck, and test
        run: bunx turbo run typecheck test --filter=@codevisor/cloud
      # Schema first, code second: old Worker code must tolerate the new
      # schema for the moments between these two steps (additive-only rule).
      - name: Apply D1 migrations
        working-directory: apps/cloud
        run: bunx wrangler d1 migrations apply codevisor-cloud --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build CSS
        working-directory: apps/cloud
        run: bun run build:css
      # All at once, deliberately. A deploy restarts every UserHub Durable
      # Object and drops its WebSockets (a platform behavior — DO sockets
      # cannot be drained), but clients ride that out on their own: they
      # reconnect with jittered backoff and resume their sessions inside the
      # hub's grace window, with buffered frames replayed — so the global
      # reconnect blip is invisible in practice. A staged canary rollout
      # bought little on top of that and cost real complexity (version-id
      # parsing, traffic-split bookkeeping, a soak gate, and a separate
      # escape hatch for DO migrations, which `versions upload` cannot ship).
      - name: Deploy to Cloudflare
        working-directory: apps/cloud
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify deployed instance
        run: curl --fail --silent --show-error https://cloud.codevisor.dev/health
