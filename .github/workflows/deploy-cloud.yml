name: Deploy Cloud

on:
  push:
    branches:
      - main
    paths:
      - "apps/cloud/**"
      - "packages/api/**"
      - "packages/cloud-crypto/**"
      # The deploy builds RELAY_MAP from the relay inventory.
      - "apps/relay/relays.json"
      - "bun.lock"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  # Never cancel a run mid-migration; queued runs wait their turn.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, typecheck, and test
        run: bunx turbo run typecheck test --filter=@codevisor/cloud
      # Schema first, code second: old Worker code must tolerate the new
      # schema for the moments between these two steps (additive-only rule).
      - name: Apply D1 migrations
        working-directory: apps/cloud
        run: bunx wrangler d1 migrations apply codevisor-cloud --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # All at once, deliberately. A deploy restarts every UserHub Durable
      # Object and drops its WebSockets (a platform behavior — DO sockets
      # cannot be drained), but clients ride that out on their own: they
      # reconnect with jittered backoff and resume their sessions inside the
      # hub's grace window, with buffered frames replayed — so the global
      # reconnect blip is invisible in practice. A staged canary rollout
      # bought little on top of that and cost real complexity (version-id
      # parsing, traffic-split bookkeeping, a soak gate, and a separate
      # escape hatch for DO migrations, which `versions upload` cannot ship).
      # Relays authenticate their access checks with this token; the Worker
      # accepts a comma-separated list, so rotation needs no downtime.
      - name: Sync the relay authorize token
        working-directory: apps/cloud
        run: echo "$RELAY_AUTHORIZE_TOKEN" | bunx wrangler secret put RELAY_AUTHORIZE_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_AUTHORIZE_TOKEN: ${{ secrets.RELAY_AUTHORIZE_TOKEN }}
      - name: Deploy to Cloudflare
        working-directory: apps/cloud
        # RELAY_MAP: the advertised relays in apps/relay/relays.json. Its own
        # assignment, so a failing script stops the step instead of deploying
        # an empty map.
        run: |
          relay_map="$(node ../relay/relay-map.mjs)"
          bunx wrangler deploy --var "RELAY_MAP:$relay_map"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Bundle workspace packages from source (their "@codevisor/source"
          # export condition); the list replaces wrangler's defaults, so they
          # follow it. Matches apps/cloud/package.json and scripts/dev-cloud.mjs.
          WRANGLER_BUILD_CONDITIONS: "@codevisor/source,workerd,worker,browser"
      - name: Verify deployed instance
        run: curl --fail --silent --show-error https://cloud.codevisor.dev/health
