name: Deploy Cloud

on:
  push:
    branches:
      - main
    paths:
      - "apps/cloud/**"
      - "packages/api/**"
      - "packages/cloud-crypto/**"
      - "plugins/*/server.json"
      - "plugins/popular.json"
      - "apps/relay/relays.json"
      - "bun.lock"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, typecheck, and test
        run: bunx turbo run typecheck test --filter=@codevisor/cloud
      - name: Apply D1 migrations
        working-directory: apps/cloud
        run: bunx wrangler d1 migrations apply codevisor-cloud --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sync the relay authorize token
        working-directory: apps/cloud
        run: echo "$RELAY_AUTHORIZE_TOKEN" | bunx wrangler secret put RELAY_AUTHORIZE_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_AUTHORIZE_TOKEN: ${{ secrets.RELAY_AUTHORIZE_TOKEN }}
      - name: Deploy to Cloudflare
        working-directory: apps/cloud
        run: |
          relay_map="$(node ../relay/relay-map.mjs)"
          bunx wrangler deploy --var "RELAY_MAP:$relay_map"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_BUILD_CONDITIONS: "@codevisor/source,workerd,worker,browser"
      - name: Verify deployed instance
        run: curl --fail --silent --show-error https://cloud.codevisor.dev/health
