name: Deploy Cloud

on:
  push:
    branches:
      - main
    paths:
      - "apps/cloud/**"
      - "packages/api/**"
      - "packages/cloud-crypto/**"
      - "plugins/*/server.json"
      - "plugins/popular.json"
      - "apps/relay/relays.json"
      - "bun.lock"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, typecheck, and test
        run: bunx turbo run typecheck test --filter=@codevisor/cloud
      - name: Apply D1 migrations
        working-directory: apps/cloud
        run: bunx wrangler d1 migrations apply codevisor-cloud --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sync the relay authorize token
        working-directory: apps/cloud
        run: echo "$RELAY_AUTHORIZE_TOKEN" | bunx wrangler secret put RELAY_AUTHORIZE_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_AUTHORIZE_TOKEN: ${{ secrets.RELAY_AUTHORIZE_TOKEN }}
      - name: Sync the plugin report Slack webhook
        working-directory: apps/cloud
        run: |
          if [ -z "$PLUGIN_REPORT_SLACK_WEBHOOK" ]; then
            echo "PLUGIN_REPORT_SLACK_WEBHOOK isn't set; plugin reports stay stored without Slack."
            exit 0
          fi
          printf '%s' "$PLUGIN_REPORT_SLACK_WEBHOOK" | bunx wrangler secret put PLUGIN_REPORT_SLACK_WEBHOOK
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLUGIN_REPORT_SLACK_WEBHOOK: ${{ secrets.PLUGIN_REPORT_SLACK_WEBHOOK }}
      - name: Sync the GitHub plugin OAuth client
        working-directory: apps/cloud
        run: |
          if [ -z "$MCP_GITHUB_CLIENT_ID" ] || [ -z "$MCP_GITHUB_CLIENT_SECRET" ]; then
            echo "MCP_GITHUB_CLIENT_ID or MCP_GITHUB_CLIENT_SECRET isn't set; GitHub plugin sign-in stays off."
            exit 0
          fi
          printf '%s' "$MCP_GITHUB_CLIENT_ID" | bunx wrangler secret put MCP_GITHUB_CLIENT_ID
          printf '%s' "$MCP_GITHUB_CLIENT_SECRET" | bunx wrangler secret put MCP_GITHUB_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_GITHUB_CLIENT_ID: ${{ secrets.MCP_GITHUB_CLIENT_ID }}
          MCP_GITHUB_CLIENT_SECRET: ${{ secrets.MCP_GITHUB_CLIENT_SECRET }}
      - name: Sync the Slack plugin OAuth client
        working-directory: apps/cloud
        run: |
          if [ -z "$MCP_SLACK_CLIENT_ID" ]; then
            echo "MCP_SLACK_CLIENT_ID isn't set; Slack plugin sign-in stays off."
            exit 0
          fi
          printf '%s' "$MCP_SLACK_CLIENT_ID" | bunx wrangler secret put MCP_SLACK_CLIENT_ID
          if [ -n "$MCP_SLACK_CLIENT_SECRET" ]; then
            printf '%s' "$MCP_SLACK_CLIENT_SECRET" | bunx wrangler secret put MCP_SLACK_CLIENT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_SLACK_CLIENT_ID: ${{ secrets.MCP_SLACK_CLIENT_ID }}
          MCP_SLACK_CLIENT_SECRET: ${{ secrets.MCP_SLACK_CLIENT_SECRET }}
      - name: Sync the Gmail push settings
        working-directory: apps/cloud
        run: |
          if [ -z "$GMAIL_PUSH_TOPIC" ] || [ -z "$GMAIL_PUSH_AUDIENCE" ] || [ -z "$GMAIL_PUSH_SERVICE_ACCOUNT" ]; then
            echo "GMAIL_PUSH_TOPIC, GMAIL_PUSH_AUDIENCE or GMAIL_PUSH_SERVICE_ACCOUNT isn't set; Gmail push stays off."
            exit 0
          fi
          printf '%s' "$GMAIL_PUSH_TOPIC" | bunx wrangler secret put GMAIL_PUSH_TOPIC
          printf '%s' "$GMAIL_PUSH_AUDIENCE" | bunx wrangler secret put GMAIL_PUSH_AUDIENCE
          printf '%s' "$GMAIL_PUSH_SERVICE_ACCOUNT" | bunx wrangler secret put GMAIL_PUSH_SERVICE_ACCOUNT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_PUSH_TOPIC: ${{ secrets.GMAIL_PUSH_TOPIC }}
          GMAIL_PUSH_AUDIENCE: ${{ secrets.GMAIL_PUSH_AUDIENCE }}
          GMAIL_PUSH_SERVICE_ACCOUNT: ${{ secrets.GMAIL_PUSH_SERVICE_ACCOUNT }}
      - name: Deploy to Cloudflare
        working-directory: apps/cloud
        run: |
          relay_map="$(node ../relay/relay-map.mjs)"
          bunx wrangler deploy --var "RELAY_MAP:$relay_map"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_BUILD_CONDITIONS: "@codevisor/source,workerd,worker,browser"
      - name: Verify deployed instance
        run: curl --fail --silent --show-error https://cloud.codevisor.dev/health
