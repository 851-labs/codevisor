name: Net Media Lab (851-3768, throwaway)

on:
  push:
    branches: [lab/851-3768-transport-lab]

permissions:
  contents: read

concurrency:
  group: screen-sharing-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VARIANTS: "cubic-1024 cubic-128 bbr3-128"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  loopback:
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - name: Environment
        run: |
          hostname; uptime; sysctl -n machdep.cpu.brand_string; pmset -g therm | tail -3 || true
      - name: Build
        working-directory: packages/net
        run: cargo build --release --example media_bench
      - name: Measure every variant over loopback
        working-directory: packages/net
        run: |
          set -euo pipefail
          bin=target/release/examples/media_bench
          mkdir -p "$RUNNER_TEMP/lab"
          port=47200
          for variant in $VARIANTS; do
            CODEVISOR_NET_MEDIA_TUNING="$variant" "$bin" serve --bind "127.0.0.1:$port" --udp-echo "127.0.0.1:$((port + 1))" \
              > "$RUNNER_TEMP/lab/serve-$variant.log" 2>&1 &
            server=$!
            for _ in $(seq 50); do grep -q '^endpoint ' "$RUNNER_TEMP/lab/serve-$variant.log" && break; sleep 0.2; done
            id="$(sed -n 's/^endpoint \([0-9a-f]*\) .*/\1/p' "$RUNNER_TEMP/lab/serve-$variant.log")"
            echo "::group::$variant"
            CODEVISOR_NET_MEDIA_TUNING="$variant" "$bin" run --peer "$id" --addr "127.0.0.1:$port" --udp "127.0.0.1:$((port + 1))" \
              2>&1 | tee "$RUNNER_TEMP/lab/run-$variant.txt" || true
            echo "::endgroup::"
            kill "$server" || true
            port=$((port + 10))
          done
          for variant in $VARIANTS; do
            { echo "## $variant"; echo '```'; cat "$RUNNER_TEMP/lab/run-$variant.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: net-media-lab-loopback
          path: ${{ runner.temp }}/lab
