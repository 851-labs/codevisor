name: Screen Sharing Bench Loopback

on:
  workflow_dispatch:
    inputs:
      matrices:
        description: Back-to-back full matrices (S1–S6 × N0–N7 at R1), 1 to 3
        required: false
        default: "2"
        type: string
      own-window:
        description: Also stream the player's own window (scroll at N0)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: screen-sharing-bench
  cancel-in-progress: false

env:
  MATRICES: ${{ inputs.matrices }}
  OWN_WINDOW: ${{ inputs.own-window }}

jobs:
  loopback:
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 60
    steps:
      - name: Check the inputs
        run: '[[ "$MATRICES" =~ ^[1-3]$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: apps/screen-sharing-bench/scripts
          set-safe-directory: false
      - name: Run the loopback benchmark on tamale
        run: apps/screen-sharing-bench/scripts/loopback.sh "$RUNNER_TEMP/results/tamale" "$MATRICES" "$OWN_WINDOW"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: loopback-tamale
          path: ${{ runner.temp }}/results/tamale
