name: Media Transport Lab (851-3815, throwaway)

# Engine v2 E1: codevisor-media over iroh vs plain UDP. Two minis inside the signed CodevisorBench.app (macOS Local
# Network privacy blocks the unsigned runner binary), then loopback, send cost and FFI hand-off on tamale.
on:
  push:
    branches: [lab/851-3815-media-lab]

permissions:
  contents: read

concurrency:
  group: screen-sharing-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HOST_IP: 192.168.10.78
  VIEWER_IP: 192.168.10.103
  # Throwaway bench keys, so the host can derive the viewer's endpoint id. Nothing else uses them.
  LAB_SECRET_N0: 1c3509b9f2b64dbca1181de09a2846dc8591c0855f79a3b9a675fb390230274c
  LAB_SECRET_N3: 8f54671cdd55c72e1e311f7132b14ba577745d63462745509280c572bb67cbd5
  SECONDS_PER_ROW: "10"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  host:
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Environment
        run: hostname; uptime; pmset -g therm | tail -3 || true
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Two minis, N0
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/lab"
          apps/screen-sharing-bench/scripts/run-installed.sh media-transport --role host --peer-secret "$LAB_SECRET_N0" \
            --peer "$VIEWER_IP:47310" --udp-peer "$VIEWER_IP:47311" --seconds "$SECONDS_PER_ROW" \
            --network-label "N0 (tamale to croissant)" --json "$RUNNER_TEMP/lab/two-minis-n0.json" | tee "$RUNNER_TEMP/lab/two-minis-n0.md"
      - name: Two minis, N3 (dummynet on croissant)
        if: always()
        run: |
          set -o pipefail
          apps/screen-sharing-bench/scripts/run-installed.sh media-transport --role host --peer-secret "$LAB_SECRET_N3" \
            --peer "$VIEWER_IP:47320" --udp-peer "$VIEWER_IP:47321" --seconds "$SECONDS_PER_ROW" \
            --network-label "N3 (dummynet on croissant: 1 ms, 1% each way)" --json "$RUNNER_TEMP/lab/two-minis-n3.json" \
            | tee "$RUNNER_TEMP/lab/two-minis-n3.md"
      - name: Frame hand-off cost, Rust and across the FFI
        if: always()
        run: |
          apps/screen-sharing-bench/scripts/run-installed.sh media-transport --role ffi-cost | tee "$RUNNER_TEMP/lab/ffi-cost.md"
      - name: Summary
        if: always()
        run: |
          for file in two-minis-n0 two-minis-n3 ffi-cost; do
            [[ -f "$RUNNER_TEMP/lab/$file.md" ]] || continue
            { echo "## $file"; grep -v '^\[{' "$RUNNER_TEMP/lab/$file.md" || true; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: media-transport-lab-tamale
          path: ${{ runner.temp }}/lab

  viewer:
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Environment
        run: hostname; uptime; ping -c 10 -i 0.2 "$HOST_IP" | tail -2
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: View N0
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/lab"
          apps/screen-sharing-bench/scripts/run-installed.sh media-transport --role viewer --secret "$LAB_SECRET_N0" \
            --bind 0.0.0.0:47310 --udp-bind 0.0.0.0:47311 --seconds "$SECONDS_PER_ROW" | tee "$RUNNER_TEMP/lab/viewer-n0.txt"
      - name: View N3 behind dummynet
        if: always()
        run: |
          set -o pipefail
          export TIER2_HOST_IP="$HOST_IP"
          source apps/screen-sharing-bench/scripts/tier2-lib.sh
          source apps/screen-sharing-bench/scripts/tier2-network.sh
          network_apply N3
          trap network_reset EXIT
          apps/screen-sharing-bench/scripts/run-installed.sh media-transport --role viewer --secret "$LAB_SECRET_N3" \
            --bind 0.0.0.0:47320 --udp-bind 0.0.0.0:47321 --seconds "$SECONDS_PER_ROW" | tee "$RUNNER_TEMP/lab/viewer-n3.txt"
      - name: Remove any network shaping
        if: always()
        run: apps/screen-sharing-bench/scripts/tier2-network-reset.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: media-transport-lab-croissant
          path: ${{ runner.temp }}/lab
