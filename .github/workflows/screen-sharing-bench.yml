name: Screen Sharing Bench

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: nightly records a baseline run (main only); adhoc records nothing the gate reads
        required: false
        default: adhoc
        type: choice
        options: [adhoc, nightly]
      scenes:
        description: Comma-separated Tier 1 scenes for a custom run; leave both lists empty for the nightly plan
        required: false
        default: ""
        type: string
      networks:
        description: Comma-separated Tier 1 networks for a custom run (empty with scenes set means N0,N3)
        required: false
        default: ""
        type: string
      plans:
        description: Tier 1 plans to run, comma-separated (core, gate, matrix, core-v2, gate-v2); empty runs core, gate, matrix and gate-v2
        required: false
        default: ""
        type: string
      engine:
        description: Codevisor engine for a custom Tier 1 run, v1 (WebRTC) or v2
        required: false
        default: v1
        type: choice
        options: [v1, v2]
      source:
        description: Frame source for a custom run (own-window needs tamale's GUI session unlocked)
        required: false
        default: synthetic
        type: choice
        options: [synthetic, own-window]
      calibration:
        description: Also run the calibration workflow (C1, C2) on both minis
        required: false
        default: false
        type: boolean
      tier2:
        description: Also run Tier 2 (Codevisor vs Apple HP) with its default inputs
        required: false
        default: false
        type: boolean
      encode_lab:
        description: Run only the encoder lab with these semicolon-separated configs (see encode-lab --help)
        required: false
        default: ""
        type: string
      encode_lab_options:
        description: Other encode-lab options, such as --scenes scroll,typing --duration 8
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - packages/swift/ScreenSharing/**
      - packages/swift/CodevisorCoreMac/Sources/CodevisorCoreMac/ScreenSharing/**
      - apps/screen-sharing-bench/**
      - packages/net/crates/codevisor-media/**
      - .github/workflows/screen-sharing-bench.yml

permissions:
  contents: read

env:
  TIER1_DURATION: "30"
  TIER1_WARM_UP: "10"
  TIER1_REPETITIONS: "3"

jobs:
  plan:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      trigger: ${{ steps.plan.outputs.trigger }}
      preflight: ${{ steps.plan.outputs.preflight }}
      own_window: ${{ steps.plan.outputs.own_window }}
      publish: ${{ steps.plan.outputs.publish }}
      tier2: ${{ steps.plan.outputs.tier2 }}
      calibration: ${{ steps.plan.outputs.calibration }}
      encode_lab: ${{ steps.plan.outputs.encode_lab }}
    steps:
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
          SCENES: ${{ inputs.scenes }}
          NETWORKS: ${{ inputs.networks }}
          SOURCE: ${{ inputs.source }}
          TIER2_INPUT: ${{ inputs.tier2 }}
          CALIBRATION_INPUT: ${{ inputs.calibration }}
          ENCODE_LAB: ${{ inputs.encode_lab }}
          NIGHTLY_TIER2: ${{ vars.SCREEN_SHARING_BENCH_NIGHTLY_TIER2 }}
        run: |
          run=true mode=nightly trigger=$EVENT publish=false tier2=false calibration=false own_window=false encode_lab=false
          preflight="--quiet --allow-locked"
          pacific_cron="0 10 * * *"
          [[ "$(TZ=America/Los_Angeles date +%z)" == -0800 ]] && pacific_cron="0 11 * * *"
          case "$EVENT" in
            schedule)
              [[ "$CRON" == "$pacific_cron" ]] || run=false
              trigger=nightly
              [[ "$run" == true && "$NIGHTLY_TIER2" == true ]] && tier2=true calibration=true
              ;;
            workflow_dispatch)
              trigger=$KIND
              tier2=$TIER2_INPUT calibration=$CALIBRATION_INPUT
              [[ -n "$SCENES$NETWORKS" ]] && mode=custom trigger=adhoc
              [[ "$mode" == custom && "$SOURCE" == own-window ]] && own_window=true preflight="--quiet"
              [[ -n "$ENCODE_LAB" ]] && run=false encode_lab=true
              ;;
          esac
          [[ "$GITHUB_REF" == refs/heads/main && "$EVENT" != pull_request ]] && publish=true
          [[ "$trigger" == nightly && "$publish" != true ]] && trigger=adhoc
          {
            echo "run=$run"; echo "mode=$mode"; echo "trigger=$trigger"; echo "preflight=$preflight"
            echo "publish=$publish"; echo "tier2=$tier2"; echo "calibration=$calibration"; echo "own_window=$own_window"
            echo "encode_lab=$encode_lab"
          } | tee -a "$GITHUB_OUTPUT"

  tier1:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 150
    concurrency:
      group: screen-sharing-bench
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TIER1_TRIGGER: ${{ needs.plan.outputs.trigger }}
      SCENES: ${{ inputs.scenes }}
      NETWORKS: ${{ inputs.networks }}
      TIER1_SOURCE: ${{ inputs.source || 'synthetic' }}
      TIER1_PLANS: ${{ inputs.plans }}
      TIER1_ENGINE: ${{ inputs.engine || 'v1' }}
      MODE: ${{ needs.plan.outputs.mode }}
      PREFLIGHT: ${{ needs.plan.outputs.preflight }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SCENES" =~ ^([a-z-]+(,[a-z-]+)*)?$ ]] || { echo "scenes must be a comma-separated list"; exit 1; }
          [[ "$NETWORKS" =~ ^(N[0-7](,N[0-7])*)?$ ]] || { echo "networks must be like N0,N3"; exit 1; }
          plan="(core|gate|matrix|core-v2|gate-v2)"
          [[ -z "$TIER1_PLANS" || "$TIER1_PLANS" =~ ^$plan(,$plan)*$ ]] || { echo "plans must be core, gate, matrix, core-v2 or gate-v2"; exit 1; }
          if [[ "$MODE" == custom && -n "$TIER1_PLANS" ]]; then
            echo "::warning::plans applies to the nightly plan only; a run with scenes or networks set is one custom report"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install it where the permission grants are (own-window only)
        if: ${{ needs.plan.outputs.own_window == 'true' }}
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Wait for a quiet machine (C5)
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/run-installed.sh preflight $PREFLIGHT > "$RUNNER_TEMP/results/preflight.json"
      - name: Run Tier 1
        run: |
          export TIER1_SCENES="$SCENES" TIER1_NETWORKS="${NETWORKS:-N0,N3}"
          [[ -n "$TIER1_PLANS" ]] || unset TIER1_PLANS
          caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier1.sh "$MODE" "$RUNNER_TEMP/results"
      - name: Record the reports on benchmark-results
        if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
        run: apps/screen-sharing-bench/scripts/publish.sh "$RUNNER_TEMP/results"
      - name: Write the summary
        if: ${{ !cancelled() }}
        run: apps/screen-sharing-bench/scripts/summary.sh "$RUNNER_TEMP/results" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tier1-tamale
          path: ${{ runner.temp }}/results
          retention-days: 90

  stop-gate:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: screen-sharing-bench-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Stop the gate of a closed or merged pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "Pull request $PR is closed; this job took over its gate group."

  gate:
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 100
    concurrency:
      group: screen-sharing-bench-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      TIER1_TRIGGER: pull_request
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Pick the engines the pull request touches
        run: |
          engines=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | apps/screen-sharing-bench/scripts/gate-engines.sh)
          echo "TIER1_GATE_ENGINES=$engines" >> "$GITHUB_ENV"
          echo "Gating engines: $engines"
      - name: Note any bench job the gate waited for
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/gate-wait.sh > "$RUNNER_TEMP/results/waited.md"
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Wait for a quiet machine (C5)
        run: apps/screen-sharing-bench/scripts/run-installed.sh preflight --quiet --allow-locked > "$RUNNER_TEMP/results/preflight.json"
      - name: Run the gate cells twice
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier1.sh pr_gate "$RUNNER_TEMP/results"
      - name: Compare with the nightly baseline
        run: |
          results="$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/results-branch.sh index "$results/index.jsonl"
          status=0
          for engine in ${TIER1_GATE_ENGINES//,/ }; do
            suffix=""
            [[ "$engine" == v2 ]] && suffix=-v2
            apps/screen-sharing-bench/scripts/run-installed.sh gate --index "$results/index.jsonl" \
              --first "$results/first$suffix.json" --second "$results/second$suffix.json" > "$results/gate$suffix.md" || status=1
            cat "$results/gate$suffix.md" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$results/waited.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gate-tamale
          path: ${{ runner.temp }}/results
          retention-days: 30

  calibration:
    needs: [plan, tier1]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.calibration == 'true' }}
    uses: ./.github/workflows/screen-sharing-bench-calibration.yml
    secrets: inherit

  tier2:
    needs: [plan, tier1, calibration]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.tier2 == 'true' }}
    uses: ./.github/workflows/screen-sharing-bench-tier2.yml
    secrets: inherit

  encode-lab:
    needs: plan
    if: ${{ needs.plan.outputs.encode_lab == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 30
    concurrency:
      group: screen-sharing-lab-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      CONFIGS: ${{ inputs.encode_lab }}
      OPTIONS: ${{ inputs.encode_lab_options }}
    steps:
      - name: Check the inputs
        run: |
          configs='^[a-zA-Z0-9=,.;@_-]+$' options='^[a-zA-Z0-9 ,.-]*$'
          [[ "$CONFIGS" =~ $configs ]] || { echo "encode_lab must be key=value configs"; exit 1; }
          [[ "$OPTIONS" =~ $options ]] || { echo "encode_lab_options must be plain options"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Wait for a quiet machine (C5)
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apps/screen-sharing-bench/scripts/run-installed.sh preflight --quiet --allow-locked > "$RUNNER_TEMP/results/preflight.json"
      - name: Run the encoder lab
        run: |
          read -ra options <<< "$OPTIONS"
          caffeinate -d -i -s apps/screen-sharing-bench/scripts/run-installed.sh encode-lab --configs "$CONFIGS" \
            ${options[@]+"${options[@]}"} --output "$RUNNER_TEMP/results/encode-lab.json" \
            --markdown "$RUNNER_TEMP/results/encode-lab.md" > /dev/null
          cat "$RUNNER_TEMP/results/encode-lab.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encode-lab-tamale
          path: ${{ runner.temp }}/results
          retention-days: 90
