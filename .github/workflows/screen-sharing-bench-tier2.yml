name: Screen Sharing Bench Tier 2

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: Comma-separated scenes (one per dispatch keeps it under 30 minutes)
        required: false
        default: scroll
        type: string
      repetitions:
        description: Repetitions per scene of Apple HP, Codevisor R1x2 and Codevisor R1, 1 to 4
        required: false
        default: "3"
        type: string
      duration:
        description: Seconds per run, 15 to 120
        required: false
        default: "60"
        type: string
      floor-repetitions:
        description: Null-sharing floor runs per scene, 0 to 3
        required: false
        default: "1"
        type: string
      c4:
        description: Also run S5 with the host observer off (C4) when video is among the scenes
        required: false
        default: true
        type: boolean
      network:
        description: N0 (no shaping) or N3 (1 ms and 1% loss each way, dummynet on croissant)
        required: false
        default: N0
        type: string
      systems:
        description: "851-3766 scratch: comma-separated systems to run (apple-hp, codevisor-r1x2, codevisor) or all"
        required: false
        default: all
        type: string
      capture:
        description: "851-3766 scratch: tcpdump headers on tamale and unified logs on both Macs"
        required: false
        default: false
        type: boolean
      vt-probe:
        description: "851-3766 scratch: run only the VideoToolbox private-key probe on tamale (seconds per run)"
        required: false
        default: "0"
        type: string
  workflow_call:
    inputs:
      scenes:
        description: Comma-separated scenes (one per dispatch keeps it under 30 minutes)
        required: false
        default: scroll
        type: string
      repetitions:
        description: Repetitions per scene of Apple HP, Codevisor R1x2 and Codevisor R1, 1 to 4
        required: false
        default: "3"
        type: string
      duration:
        description: Seconds per run, 15 to 120
        required: false
        default: "60"
        type: string
      floor-repetitions:
        description: Null-sharing floor runs per scene, 0 to 3
        required: false
        default: "1"
        type: string
      c4:
        description: Also run S5 with the host observer off (C4) when video is among the scenes
        required: false
        default: true
        type: boolean
      network:
        description: N0 (no shaping) or N3 (1 ms and 1% loss each way, dummynet on croissant)
        required: false
        default: N0
        type: string

permissions:
  contents: read

concurrency:
  group: screen-sharing-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TIER2_HOST_IP: 192.168.10.78
  TIER2_VIEWER_IP: 192.168.10.103
  TIER2_SCENES: ${{ inputs.scenes }}
  TIER2_REPS: ${{ inputs.repetitions }}
  TIER2_DURATION: ${{ inputs.duration }}
  TIER2_FLOOR_REPS: ${{ inputs.floor-repetitions }}
  TIER2_C4: ${{ inputs.c4 && '1' || '0' }}
  TIER2_NETWORK: ${{ inputs.network }}
  TIER2_RENDEZVOUS_S: 1800
  TIER2_SYSTEMS: ${{ inputs.systems || 'all' }}
  TIER2_CAPTURE: ${{ inputs.capture && '1' || '0' }}

jobs:
  vt-probe:
    if: ${{ inputs.vt-probe != '' && inputs.vt-probe != '0' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Run the VideoToolbox probe on tamale
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          { uptime; sysctl -n machdep.cpu.brand_string; sw_vers; pmset -g therm; } >"$RUNNER_TEMP/probe/environment.txt" 2>&1
          swiftc -O apps/screen-sharing-bench/scratch-851-3766/vtprobe.swift -o "$RUNNER_TEMP/vtprobe"
          caffeinate -d -i -s "$RUNNER_TEMP/vtprobe" "${{ inputs.vt-probe }}" >"$RUNNER_TEMP/probe/vtprobe.jsonl" 2>"$RUNNER_TEMP/probe/vtprobe.err"
          uptime >>"$RUNNER_TEMP/probe/environment.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vt-probe-tamale
          path: ${{ runner.temp }}/probe

  host:
    if: ${{ inputs.vt-probe == '' || inputs.vt-probe == '0' }}
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Host the Tier 2 runs on tamale
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier2-host.sh "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tier2-tamale
          path: ${{ runner.temp }}/results

  viewer:
    if: ${{ inputs.vt-probe == '' || inputs.vt-probe == '0' }}
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: View the Tier 2 runs on croissant
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier2-viewer.sh "$RUNNER_TEMP/results"
      - name: Remove any network shaping
        if: always()
        run: apps/screen-sharing-bench/scripts/tier2-network-reset.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tier2-croissant
          path: ${{ runner.temp }}/results

  report:
    needs: [host, viewer]
    if: ${{ !cancelled() && (inputs.vt-probe == '' || inputs.vt-probe == '0') }}
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: tier2-*
          merge-multiple: true
          path: ${{ runner.temp }}/runs
      - name: Build the report and the target table
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          apps/screen-sharing-bench/scripts/run-installed.sh tier2-report --runs "$RUNNER_TEMP/runs" \
            --run-id "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/report/report.json" \
            --markdown "$RUNNER_TEMP/report/summary.md" > /dev/null
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tier2-report
          path: ${{ runner.temp }}/report
