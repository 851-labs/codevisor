name: Screen Sharing Bench Tier 2

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: Comma-separated scenes (one per dispatch keeps it under 30 minutes)
        required: false
        default: scroll
        type: string
      repetitions:
        description: Repetitions per scene of Apple HP, Codevisor R1x2 and Codevisor R1, 1 to 4
        required: false
        default: "3"
        type: string
      duration:
        description: Seconds per run, 15 to 120
        required: false
        default: "60"
        type: string
      floor-repetitions:
        description: Null-sharing floor runs per scene, 0 to 3
        required: false
        default: "1"
        type: string
      c4:
        description: Also run S5 with the host observer off (C4) when video is among the scenes
        required: false
        default: true
        type: boolean
      network:
        description: N0 (no shaping) or N3 (1 ms and 1% loss each way, dummynet on croissant)
        required: false
        default: N0
        type: string
      engine:
        description: Codevisor engine for the Codevisor systems, v1 (WebRTC) or v2
        required: false
        default: v1
        type: string
      present:
        description: Engine v2 presentation on the viewer, arrival or display-link
        required: false
        default: arrival
        type: string
      systems:
        description: Comma-separated systems to run besides the floor (apple-hp, codevisor-r1x2, codevisor-v2, codevisor-v2-vcp, codevisor)
        required: false
        default: apple-hp,codevisor-r1x2,codevisor
        type: string
      viewer-display:
        description: Where croissant shows every system, main (its 1920x1080 display) or R1x2 (a 3840x2160 virtual display, so Apple HP is 1:1)
        required: false
        default: main
        type: string
      profile:
        description: Also sample call trees of the host's sharing processes for 10 s in each run (perturbs that run's numbers)
        required: false
        default: false
        type: boolean
      vcp-fail-after:
        description: Seconds into each codevisor-v2-vcp run to force a VCP failure (0 never), to test the VideoToolbox fallback
        required: false
        default: "0"
        type: string
  workflow_call:
    inputs:
      scenes:
        description: Comma-separated scenes (one per dispatch keeps it under 30 minutes)
        required: false
        default: scroll
        type: string
      repetitions:
        description: Repetitions per scene of Apple HP, Codevisor R1x2 and Codevisor R1, 1 to 4
        required: false
        default: "3"
        type: string
      duration:
        description: Seconds per run, 15 to 120
        required: false
        default: "60"
        type: string
      floor-repetitions:
        description: Null-sharing floor runs per scene, 0 to 3
        required: false
        default: "1"
        type: string
      c4:
        description: Also run S5 with the host observer off (C4) when video is among the scenes
        required: false
        default: true
        type: boolean
      network:
        description: N0 (no shaping) or N3 (1 ms and 1% loss each way, dummynet on croissant)
        required: false
        default: N0
        type: string
      engine:
        description: Codevisor engine for the Codevisor systems, v1 (WebRTC) or v2
        required: false
        default: v1
        type: string
      present:
        description: Engine v2 presentation on the viewer, arrival or display-link
        required: false
        default: arrival
        type: string
      systems:
        description: Comma-separated systems to run besides the floor (apple-hp, codevisor-r1x2, codevisor-v2, codevisor-v2-vcp, codevisor)
        required: false
        default: apple-hp,codevisor-r1x2,codevisor
        type: string
      viewer-display:
        description: Where croissant shows every system, main (its 1920x1080 display) or R1x2 (a 3840x2160 virtual display, so Apple HP is 1:1)
        required: false
        default: main
        type: string
      profile:
        description: Also sample call trees of the host's sharing processes for 10 s in each run (perturbs that run's numbers)
        required: false
        default: false
        type: boolean
      vcp-fail-after:
        description: Seconds into each codevisor-v2-vcp run to force a VCP failure (0 never), to test the VideoToolbox fallback
        required: false
        default: "0"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: screen-sharing-bench
  cancel-in-progress: false

env:
  TIER2_HOST_IP: 192.168.10.78
  TIER2_VIEWER_IP: 192.168.10.103
  TIER2_SCENES: ${{ inputs.scenes }}
  TIER2_REPS: ${{ inputs.repetitions }}
  TIER2_DURATION: ${{ inputs.duration }}
  TIER2_FLOOR_REPS: ${{ inputs.floor-repetitions }}
  TIER2_C4: ${{ inputs.c4 && '1' || '0' }}
  TIER2_NETWORK: ${{ inputs.network }}
  TIER2_ENGINE: ${{ inputs.engine }}
  TIER2_PRESENT: ${{ inputs.present }}
  TIER2_SYSTEMS: ${{ inputs.systems }}
  TIER2_VIEWER_DISPLAY: ${{ inputs.viewer-display }}
  TIER2_PROFILE: ${{ inputs.profile && '1' || '0' }}
  TIER2_VCP_FAIL_AFTER: ${{ inputs.vcp-fail-after }}
  TIER2_RENDEZVOUS_S: 1800

jobs:
  wait-for-minis:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps: &wait-for-minis-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: apps/screen-sharing-bench/scripts
      - name: Wait until no other job holds or awaits tamale or croissant
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/screen-sharing-bench/scripts/tier2-pair.sh wait-for-minis 10800

  host:
    needs: wait-for-minis
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 85
    env: &first-attempt
      TIER2_PEER_SUFFIX: ""
      TIER2_PAIR_HOLD_S: 300
      TIER2_UNPAIRED: yield
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: &host-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Wait for the viewer job to start on croissant
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apps/screen-sharing-bench/scripts/tier2-pair.sh pair "viewer$TIER2_PEER_SUFFIX" "$TIER2_PAIR_HOLD_S" "$TIER2_UNPAIRED"
      - if: steps.pair.outputs.paired == 'true'
        uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        if: steps.pair.outputs.paired == 'true'
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: Host the Tier 2 runs on tamale
        if: steps.pair.outputs.paired == 'true'
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier2-host.sh "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.pair.outputs.paired == 'true'
        with:
          name: tier2-tamale${{ env.TIER2_PEER_SUFFIX }}
          path: ${{ runner.temp }}/results

  viewer:
    needs: wait-for-minis
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 85
    env: *first-attempt
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: &viewer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - name: Wait for the host job to start on tamale
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apps/screen-sharing-bench/scripts/tier2-pair.sh pair "host$TIER2_PEER_SUFFIX" "$TIER2_PAIR_HOLD_S" "$TIER2_UNPAIRED"
      - if: steps.pair.outputs.paired == 'true'
        uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Install the build where the permission grants are
        if: steps.pair.outputs.paired == 'true'
        run: apps/screen-sharing-bench/scripts/install-granted.sh
      - name: View the Tier 2 runs on croissant
        if: steps.pair.outputs.paired == 'true'
        run: caffeinate -d -i -s apps/screen-sharing-bench/scripts/tier2-viewer.sh "$RUNNER_TEMP/results"
      - name: Remove any network shaping
        if: always() && steps.pair.outputs.paired == 'true'
        run: apps/screen-sharing-bench/scripts/tier2-network-reset.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.pair.outputs.paired == 'true'
        with:
          name: tier2-croissant${{ env.TIER2_PEER_SUFFIX }}
          path: ${{ runner.temp }}/results

  wait-for-minis-again:
    needs: [host, viewer]
    if: ${{ !cancelled() && (needs.host.outputs.paired == 'false' || needs.viewer.outputs.paired == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps: *wait-for-minis-steps

  host-retry:
    needs: wait-for-minis-again
    runs-on: [self-hosted, macOS, ARM64, tamale]
    timeout-minutes: 135
    env: &retry
      TIER2_PEER_SUFFIX: -retry
      TIER2_PAIR_HOLD_S: 3600
      TIER2_UNPAIRED: fail
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: *host-steps

  viewer-retry:
    needs: wait-for-minis-again
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 135
    env: *retry
    outputs:
      paired: ${{ steps.pair.outputs.paired }}
    steps: *viewer-steps

  report:
    needs: [host, viewer, host-retry, viewer-retry]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, macOS, ARM64, croissant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          set-safe-directory: false
      - uses: ./.github/actions/build-screen-sharing-bench
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ needs.host-retry.result == 'skipped' && 'tier2-*' || 'tier2-*-retry' }}
          merge-multiple: true
          path: ${{ runner.temp }}/runs
      - name: Build the report and the target table
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          apps/screen-sharing-bench/scripts/run-installed.sh tier2-report --runs "$RUNNER_TEMP/runs" \
            --run-id "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/report/report.json" \
            --markdown "$RUNNER_TEMP/report/summary.md" > /dev/null
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tier2-report
          path: ${{ runner.temp }}/report
