lefthook: $(test -x scripts/git-hooks/run-lefthook.sh && echo scripts/git-hooks/run-lefthook.sh || echo true)

pre-commit:
  parallel: true
  commands:
    typography:
      run: scripts/check-typography.sh
    format:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json,jsonc,md,yml,yaml,css,html}"
      run: bun x oxfmt -c .oxfmtrc.json --disable-nested-config --no-error-on-unmatched-pattern --check {staged_files}
    lint:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx}"
      run: bun x oxlint -c .oxlintrc.json --disable-nested-config --deny-warnings {staged_files}

pre-push:
  commands:
    checks:
      run: unset $(git rev-parse --local-env-vars) && node scripts/check.mjs --base=origin/main --lanes=javascript,swift-style

post-checkout:
  commands:
    worktree-ready:
      run: scripts/git-hooks/post-checkout-worktree-ready.sh {1} {2} {3}
