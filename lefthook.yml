pre-commit:
  parallel: false
  commands:
    typography:
      run: scripts/check-typography.sh
    full-suite:
      run: unset $(git rev-parse --local-env-vars) && bun run check

post-checkout:
  commands:
    worktree-ready:
      run: scripts/git-hooks/post-checkout-worktree-ready.sh {1} {2} {3}
