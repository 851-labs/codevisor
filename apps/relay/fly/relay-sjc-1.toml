app = "codevisor-relay-sjc-1"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
image = "registry.fly.io/codevisor-relay:latest"

[env]
RELAY_HOSTNAME = "relay-sjc-1.codevisor.dev"
RELAY_AUTHORIZE_URL = "https://cloud.codevisor.dev/api/relay/authorize"
RUST_LOG = "info"

[deploy]
strategy = "rolling"

[mounts]
source = "relay_data"
destination = "/data"

[[services]]
protocol = "udp"
internal_port = 7842
auto_stop_machines = "off"
min_machines_running = 1

[[services.ports]]
port = 7842

[[services]]
protocol = "tcp"
internal_port = 443
auto_stop_machines = "off"
min_machines_running = 1

[[services.ports]]
port = 443
handlers = []

[services.concurrency]
type = "connections"
soft_limit = 8000
hard_limit = 10000

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "60s"

[[services.http_checks]]
interval = "15s"
timeout = "2s"
grace_period = "120s"
method = "get"
path = "/healthz"
protocol = "https"
tls_skip_verify = true

[[services]]
protocol = "tcp"
internal_port = 80
auto_stop_machines = "off"
min_machines_running = 1

[[services.ports]]
port = 80
handlers = []

[metrics]
port = 9090
path = "/metrics"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
