# Generated by infra/relays/gen-fly.mjs from relays.json. Do not edit.
app = "codevisor-relay-fra-1"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
# Overridden by `flyctl deploy --image` in CI with the SHA-tagged image.
image = "registry.fly.io/codevisor-relay:latest"

[env]
RELAY_HOSTNAME = "relay-fra-1.codevisor.dev"
RELAY_AUTHORIZE_URL = "https://cloud.codevisor.dev/api/relay/authorize"
RUST_LOG = "info"

[deploy]
strategy = "rolling"

# RELAY_AUTHORIZE_TOKEN is a Fly secret, staged by provision.mjs. No DNS or
# ACME credentials live on the relay (certificates use HTTP-01, below).
[mounts]
source = "relay_data"
destination = "/data" # certbot account, webroot, certificate; survives deploys

# QUIC Address Discovery. UDP must use the same internal and external port and
# bind to fly-global-services (resolved in entrypoint.sh). Needs a dedicated IPv4.
[[services]]
protocol = "udp"
internal_port = 7842
auto_stop_machines = "off"
min_machines_running = 1

[[services.ports]]
port = 7842

# Relay over HTTPS/WebSocket. Raw TCP passthrough (no handlers): the relay
# terminates its own TLS, and QUIC reuses the same certificate.
[[services]]
protocol = "tcp"
internal_port = 443
auto_stop_machines = "off"
min_machines_running = 1

[[services.ports]]
port = 443
handlers = []

[services.concurrency]
type = "connections"
soft_limit = 8000
hard_limit = 10000

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "60s"

[[services.http_checks]]
interval = "15s"
timeout = "2s"
grace_period = "120s"
method = "get"
path = "/healthz"
protocol = "https"
tls_skip_verify = true # the check dials the Machine's IP, not the hostname

# Plain HTTP, to the port-80 router: Let's Encrypt HTTP-01 challenges, and
# captive-portal probes (/generate_204) forwarded to the relay.
[[services]]
protocol = "tcp"
internal_port = 80
auto_stop_machines = "off"
min_machines_running = 1

[[services.ports]]
port = 80
handlers = []

[[services.http_checks]]
interval = "30s"
timeout = "2s"
grace_period = "60s"
method = "get"
path = "/generate_204"

[metrics]
port = 9090
path = "/metrics"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
